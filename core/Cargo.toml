[package]
name = "xila"
version.workspace = true
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "An operating system for embedded systems written in Rust."

[dependencies]
# - Always included
embedded-i18n = { workspace = true }


# - Host
audio = { workspace = true, optional = true }
drivers_neural_network = { workspace = true, optional = true }
neural_network = { workspace = true, optional = true }
little_fs = { workspace = true }
memory_file_system = { workspace = true }
virtual_file_system = { workspace = true }
graphics = { workspace = true, optional = true }
task = { workspace = true }
lifecycle = { workspace = true }
time = { workspace = true }
users = { workspace = true }
memory = { workspace = true }
executable = { workspace = true }
file_system = { workspace = true }
authentication = { workspace = true }
log = { workspace = true }
shared = { workspace = true }
synchronization = { workspace = true }
bootsplash = { workspace = true, optional = true }
network = { workspace = true, optional = true }
time_zone = { workspace = true, optional = true }
local_time = { workspace = true, optional = true }

[features]
default = ["network"]

executable_building = ["executable/building"]
native-dev = ["executable/native-dev"]
audio = ["dep:audio"]
neural_network = ["dep:neural_network", "dep:drivers_neural_network"]
network = ["dep:network", "executable/network"]
bootsplash = ["dep:bootsplash"]
time_zone = ["dep:time_zone", "dep:local_time"]
graphics = ["dep:graphics", "executable/graphics"]
graphics_rendering_rgb565 = ["graphics", "graphics/rendering_rgb565"]
graphics_rendering_xrgb8888 = ["graphics", "graphics/rendering_xrgb8888"]
# Portable task and executor CPU activity counters (`task::metrics`).
task_metrics = ["task/metrics"]
# Runtime services around the time subsystem: the real-time clock start-up
# read and write-back task, and the privileged manual UTC set API.
time_services = ["time/services"]
