[package]
name = "graphics"
version = "0.1.0"
edition = "2024"

[dependencies]
cstr_core = "0.2.6"
file_system = { workspace = true }
virtual_file_system = { workspace = true }
lvgl_rust_sys = { workspace = true, features = ["shadcn-theme"] }
syn = { workspace = true, features = ["full"] }
quote = "1.0"
time = { workspace = true }
shared = { workspace = true }
synchronization = { workspace = true }
log = { workspace = true }
abi_declarations = { workspace = true }
embedded-i18n = { workspace = true }
task = { workspace = true }

[dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
drivers_native = { workspace = true }
drivers_core = { workspace = true }
drivers_shared = { workspace = true }
drivers_std = { workspace = true }
users = { workspace = true }

abi_definitions = { workspace = true }

[features]
default = []
rendering_rgb565 = ["lvgl_rust_sys/color_depth_16"]
rendering_xrgb8888 = ["lvgl_rust_sys/color_depth_32"]

[[test]]
name = "graphics"
path = "tests/graphics.rs"
