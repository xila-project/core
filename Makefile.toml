[config]
default_to_workspace = false
init_task = "generate-fonts"
skip_core_tasks = true

[env]
# The optional development shell pins Rust; existing workflows retain stable.
XILA_RUST_TOOLCHAIN = { value = "stable", condition = { env_not_set = [
  "XILA_RUST_TOOLCHAIN",
] } }

[tasks.install-tools]
command = "npm"
args = ["install"]

[tasks.generate-fonts]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = ["run", "--package", "fonts_generator"]

[tasks.format-rust]
install_crate = "rustfmt"
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = ["fmt", "--all", "${@}"]

[tasks.format-toml]
command = "taplo"
args = ["format", "${@}"]

[tasks.format-json]
command = "npm"
args = ["exec", "prettier", "--", "--write", "**/*.json", "${@}"]

[tasks.format]
dependencies = ["format-rust", "format-toml", "format-json"]

[tasks.translate-compare]
command = "npm"
args = ["exec", "tolgee", "compare", "${@}"]

[tasks.translate-sync]
command = "npm"
args = ["exec", "tolgee", "sync", "--", "--remove-unused", "${@}"]

[tasks.translate-pull]
command = "npm"
args = ["exec", "tolgee", "pull", "${@}"]

[tasks.translate-push]
command = "npm"
args = ["exec", "tolgee", "push", "${@}"]

[tasks.check-host]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = [
  "check",
  "--target",
  "x86_64-unknown-linux-gnu",
  "--features",
  "graphics,abi_definitions,graphics_rendering_xrgb8888",
]

[tasks.check-guest]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = [
  "check",
  "--target",
  "wasm32-unknown-unknown",
  "--package",
  "wasm",
  "--no-default-features",
  "--features",
  "default_guest",
]

[tasks.doc-host]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = [
  "doc",
  "--features",
  "graphics,abi_definitions,graphics_rendering_xrgb8888",
  "--target",
  "x86_64-unknown-linux-gnu",
]

[tasks.doc-guest]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = [
  "doc",
  "--package",
  "wasm",
  "--no-default-features",
  "--features",
  "default_guest",
  "--target",
  "wasm32-unknown-unknown",
]

[tasks.doc]
dependencies = ["doc-host", "doc-guest"]

[tasks.check]
dependencies = ["check-host", "check-guest"]

[tasks.check-localization-host]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
env = { EMBEDDED_I18N_STRICT = "1" }
args = [
  "check",
  "--workspace",
  "--all-targets",
  "--exclude",
  "fonts_generator",
  "--target",
  "x86_64-unknown-linux-gnu",
  "--features",
  "xila/graphics,xila/abi_definitions,xila/graphics_rendering_xrgb8888",
]

[tasks.check-localization-guest]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
env = { EMBEDDED_I18N_STRICT = "1" }
args = [
  "check",
  "--target",
  "wasm32-wasip1",
  "--package",
  "calculator",
  "--package",
  "weather",
  "--package",
  "clock",
  "--package",
  "pixel_painter",
  "--package",
  "synth",
]

[tasks.check-localization]
dependencies = ["check-localization-host", "check-localization-guest"]

[tasks.clippy-host]
install_crate = "clippy"
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = [
  "clippy",
  "--target",
  "x86_64-unknown-linux-gnu",
  "--features",
  "graphics,abi_definitions,graphics_rendering_xrgb8888",
  "--all-targets",
  "--",
  "-D",
  "warnings",
]

[tasks.clippy-guest]
install_crate = "clippy"
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = [
  "clippy",
  "--package",
  "wasm",
  "--no-default-features",
  "--features",
  "default_guest",
  "--target",
  "wasm32-unknown-unknown",
  "--all-targets",
  "--",
  "-D",
  "warnings",
]

[tasks.clippy]
dependencies = ["clippy-host", "clippy-guest"]

[tasks.lint]
install_crate = "clippy"
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.test]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = ["test", "--workspace"]

[tasks.run]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = ["run", "${@}"]

[tasks.build]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = ["build", "${@}"]

[tasks.build-profiling]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = [
  "build",
  "--package",
  "native_example",
  "--profile",
  "profiling",
  "${@}",
]

[tasks.prepare-profiling]
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = [
  "build",
  "--package",
  "calculator",
  "--package",
  "weather",
  "--package",
  "clock",
  "--package",
  "pixel_painter",
  "--package",
  "synth",
  "--target",
  "wasm32-wasip1",
  "--profile",
  "release-wasm",
]

[tasks.coverage]
install_crate = "cargo-llvm-cov"
toolchain = "${XILA_RUST_TOOLCHAIN}"
command = "cargo"
args = ["llvm-cov", "--workspace", "--coverage-host-only", "${@}"]

[tasks.before-commit]
dependencies = ["format", "check", "doc", "clippy"]

[tasks.prepare-native-image]
dependencies = ["prepare-profiling"]
script = '''
set -eu
mkdir -p target/seed/native
rm -f target/seed/native/seed.img
cargo run --package fs_image -- target/seed/native/seed.img 16777216 --bundle native --applications-dir target/wasm32-wasip1/release-wasm
'''

[tasks.prepare-wasm-image]
script = '''
set -eu
cargo build -p calculator -p clock -p pixel_painter -p synth --target wasm32-wasip1 --release
mkdir -p target/seed/wasm
rm -f target/seed/wasm/seed.img
cargo run --package fs_image -- target/seed/wasm/seed.img 16777216 --bundle wasm --applications-dir target/wasm32-wasip1/release
'''
