[package]
name = "package_format_eval"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
hadris-cpio = { version = "=2.5.0", default-features = false, features = ["read", "std", "sync", "write"] }
lz4_flex = { version = "=0.12.2", default-features = false, features = ["std"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.228", features = ["derive"] }
tar = { version = "=0.4.46", default-features = false }
