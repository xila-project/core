[profile.release-wasm]
inherits = "release"
opt-level = 's'
strip = true
lto = true

[profile.profiling]
inherits = "release"
debug = "full"
strip = false

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
repository = "https://github.com/xila-project/core"

[workspace.dependencies]
xila = { path = "core" }
xila_http = { path = "libraries/http", default-features = false }
audio = { package = "xila-audio", path = "libraries/audio" }
neural_network = { package = "xila-neural-network", path = "libraries/neural_network" }
nanoaudio = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
abi_declarations = { package = "xila-abi-declarations", path = "libraries/abi/declarations" }
abi_definitions = { package = "xila-abi-definitions", path = "libraries/abi/definitions" }
little_fs = { package = "xila-little-fs", path = "libraries/little_fs" }
virtual_file_system = { package = "xila-virtual-file-system", path = "subsystems/virtual_file_system" }
graphics = { package = "xila-graphics", path = "subsystems/graphics" }
time = { package = "xila-time", path = "subsystems/time" }
task = { package = "xila-task", path = "subsystems/task" }
users = { package = "xila-users", path = "subsystems/users" }
memory = { package = "xila-memory", path = "subsystems/memory" }
executable = { package = "xila-executable", path = "libraries/executable" }
file_system = { package = "xila-file-system", path = "libraries/file_system" }
authentication = { package = "xila-authentication", path = "libraries/authentication" }
log = { package = "xila-log", path = "subsystems/log" }
shared = { package = "xila-shared", path = "libraries/shared" }
synchronization = { package = "xila-synchronization", path = "libraries/synchronization" }
network = { package = "xila-network", path = "subsystems/network" }
debug_protocol = { package = "xila-debug-protocol", path = "libraries/debug_protocol" }
peripherals = { package = "xila-peripherals", path = "libraries/peripherals" }
bootsplash = { package = "xila-bootsplash", path = "libraries/bootsplash" }
peripheral_devices = { package = "xila-peripheral-devices", path = "libraries/peripheral_devices" }
embedded-i18n = { version = "=0.2.0", default-features = false, features = [
  "backend-json",
] }
testing = { package = "xila-testing", path = "libraries/testing" }
device = { package = "xila-device", path = "devices" }

# - Drivers
drivers_core = { package = "xila-drivers-core", path = "drivers/core" }

# - Executables

# - External crates
embedded-hal = { version = "1", default-features = false }
embedded-hal-async = { version = "1", default-features = false }
miniserde = { version = "0.1" }
bindgen = { version = "0.73" }
cbindgen = { version = "0.29" }
syn = { version = "3.0" }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
lvgl_rust_sys = { git = "https://github.com/Xila-Project/lvgl_rust_sys.git", rev = "90038a9f63c3d711dfdb87069239002629e2121b", default-features = false }
embassy-executor = { version = "0.10", default-features = false }
embassy-futures = { version = "0.1" }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5" }
critical-section = { version = "1.2" }
smoltcp = { version = "0.14" }
linked_list_allocator = { version = "0.10", default-features = false, features = [
  "const_mut_refs",
] }
smol_str = { version = "0.3", default-features = false }
darling = { version = "0.24" }
regex = { version = "1" }
embedded-io-async = { version = "0.7", features = ["alloc"] }
embedded-io = { version = "0.7", features = ["alloc"] }
embedded-tls = { version = "0.19", default-features = false, features = [
  "alloc",
] }
getargs-derive = { git = "https://github.com/AlixANNERAUD/getargs-derive.git", rev = "65b20961504ad5ba387ea13f0e9501036941ab17" } # v0.1.0

[workspace]
resolver = "3"
default-members = ["core"]
members = [
  "core",
  "libraries/testing",
  "libraries/shared",
  "libraries/http",
  "libraries/firmware_update",
  "libraries/audio",
  "libraries/neural_network",
  "libraries/file_system",
  "subsystems/graphics",
  "subsystems/task",
  "subsystems/users",
  "libraries/peripherals",
  "libraries/peripheral_devices",
  "subsystems/memory",
  "subsystems/time",
  "libraries/abi/definitions",
  "libraries/abi/declarations",
  "subsystems/virtual_file_system",
  "libraries/little_fs",
  "libraries/executable",
  "libraries/authentication",
  "subsystems/network",
  "libraries/debug_protocol",
  "libraries/synchronization",
  "subsystems/task/task_macros",
  "subsystems/log",
  "libraries/bootsplash",
  "drivers/core",

  "devices",
  "subsystems/graphics/bindings_generator",
]

[patch.crates-io]
littlefs2-sys = { path = "libraries/littlefs2_sys" }
