[package]
name = "xila"
version = "0.1.0"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
edition = "2024"
resolver = "2"
rust-version = "1.90.0"
license = "Apache-2.0"
description = "An operating system for embedded systems written in Rust."

[profile.release-wasm]
inherits = "release"
opt-level = 's'
strip = true
lto = true

[profile.profiling]
inherits = "release"
debug = "full"
strip = false

[dependencies]
# - Always included
embedded-i18n = { workspace = true }


# - Host
audio = { workspace = true, optional = true }
abi_declarations = { workspace = true, optional = true }
abi_definitions = { workspace = true, optional = true }
little_fs = { workspace = true, optional = true }
virtual_file_system = { workspace = true, optional = true }
graphics = { workspace = true, optional = true }
task = { workspace = true, optional = true }
time = { workspace = true, optional = true }
users = { workspace = true, optional = true }
memory = { workspace = true, optional = true }
executable = { workspace = true, optional = true }
file_system = { workspace = true, optional = true }
authentication = { workspace = true, optional = true }
log = { workspace = true, optional = true }
shared = { workspace = true, optional = true }
synchronization = { workspace = true, optional = true }
bootsplash = { workspace = true, optional = true }
network = { workspace = true, optional = true }

[features]
default = [
  "dep:abi_declarations",
  "dep:abi_definitions",
  "dep:little_fs",
  "dep:virtual_file_system",
  "dep:task",
  "dep:time",
  "dep:users",
  "dep:memory",
  "dep:executable",
  "dep:file_system",
  "dep:authentication",
  "dep:log",
  "dep:shared",
  "dep:synchronization",
  "abi_definitions",
  "dep:network",
]

executable_building = ["executable/building"]
audio = ["dep:audio"]
abi_definitions = ["dep:abi_definitions"]
bootsplash = ["dep:bootsplash"]
graphics = ["dep:graphics", "executable/graphics"]
graphics_rendering_rgb565 = ["graphics", "graphics/rendering_rgb565"]
graphics_rendering_xrgb8888 = ["graphics", "graphics/rendering_xrgb8888"]


[workspace.dependencies]
xila_http = { path = "libraries/http", default-features = false }
verification = { git = "https://github.com/xila-project/package_manager", rev = "f5e3f0b323a79a80d106ce2b88b77bfa8667d71b", default-features = false }
application_metadata = { package = "xila-application-metadata", path = "libraries/application_metadata" }
audio = { package = "xila-audio", path = "libraries/audio" }
nanoaudio = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-cpal = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-web = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-synth = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
abi_declarations = { package = "xila-abi-declarations", path = "libraries/abi/declarations" }
abi_definitions = { package = "xila-abi-definitions", path = "libraries/abi/definitions" }
little_fs = { package = "xila-little-fs", path = "libraries/little_fs" }
virtual_file_system = { package = "xila-virtual-file-system", path = "subsystems/virtual_file_system" }
graphics = { package = "xila-graphics", path = "subsystems/graphics" }
time = { package = "xila-time", path = "subsystems/time" }
task = { package = "xila-task", path = "subsystems/task" }
users = { package = "xila-users", path = "subsystems/users" }
memory = { package = "xila-memory", path = "subsystems/memory" }
executable = { package = "xila-executable", path = "libraries/executable" }
file_system = { package = "xila-file-system", path = "libraries/file_system" }
authentication = { package = "xila-authentication", path = "libraries/authentication" }
log = { package = "xila-log", path = "subsystems/log" }
shared = { package = "xila-shared", path = "libraries/shared" }
synchronization = { package = "xila-synchronization", path = "libraries/synchronization" }
network = { package = "xila-network", path = "subsystems/network" }
debug_protocol = { package = "xila-debug-protocol", path = "libraries/debug_protocol" }
peripherals = { package = "xila-peripherals", path = "libraries/peripherals" }
bootsplash = { package = "xila-bootsplash", path = "libraries/bootsplash" }
embedded-i18n = { version = "=0.1.3", default-features = false, features = [
  "backend-json",
] }
testing = { package = "xila-testing", path = "libraries/testing" }
device = { package = "xila-device", path = "libraries/device" }

# - Drivers
drivers_core = { package = "xila-drivers-core", path = "drivers/core" }
drivers_espressif = { package = "xila-drivers-espressif", path = "drivers/espressif" }
drivers_native = { package = "xila-drivers-native", path = "drivers/native" }
drivers_headless = { package = "xila-drivers-headless", path = "drivers/headless" }
drivers_shared = { package = "xila-drivers-shared", path = "drivers/shared" }
drivers_std = { package = "xila-drivers-std", path = "drivers/std" }
drivers_wasm = { package = "xila-drivers-wasm", path = "drivers/wasm" }

# - Executables
file_manager = { package = "xila-file-manager", path = "executables/file_manager" }
command_line_shell = { package = "xila-command-line-shell", path = "executables/shell/command_line" }
graphical_shell = { package = "xila-graphical-shell", path = "executables/shell/graphical" }
wasm = { package = "xila-wasm", path = "executables/wasm" }
terminal = { package = "xila-terminal", path = "executables/terminal" }
settings = { package = "xila-settings", path = "executables/settings" }
debug_application = { package = "xila-debug-application", path = "executables/debug" }
pixel_painter = { package = "xila-pixel-painter", path = "executables/pixel_painter" }
text_editor = { package = "xila-text-editor", path = "executables/text_editor" }
calculator = { package = "xila-calculator", path = "executables/calculator" }
weather = { package = "xila-weather", path = "executables/weather" }
clock = { package = "xila-clock", path = "executables/clock" }
synth = { package = "xila-synth", path = "executables/synth" }

# - External crates
embedded-hal = { version = "1", default-features = false }
miniserde = { version = "0.1" }
bindgen = { version = "0.73" }
cbindgen = { version = "0.29" }
syn = { version = "3.0" }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
lvgl_rust_sys = { git = "https://github.com/Xila-Project/lvgl_rust_sys.git", rev = "90038a9f63c3d711dfdb87069239002629e2121b", default-features = false }
embassy-executor = { version = "0.10", default-features = false }
embassy-futures = { version = "0.1" }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5" }
critical-section = { version = "1.2" }
smoltcp = { version = "0.14" }
linked_list_allocator = { version = "0.10", default-features = false, features = [
  "const_mut_refs",
] }
smol_str = { version = "0.3" }
darling = { version = "0.24" }
regex = { version = "1" }
embedded-io-async = { version = "0.7", features = ["alloc"] }
embedded-io = { version = "0.7", features = ["alloc"] }
embedded-tls = { version = "0.19", default-features = false, features = [
  "alloc",
] }
getargs-derive = { git = "https://github.com/AlixANNERAUD/getargs-derive.git", rev = "65b20961504ad5ba387ea13f0e9501036941ab17" } # v0.1.0

[workspace]
members = [
  "libraries/http",
  "libraries/firmware_update",
  "libraries/application_metadata",
  "libraries/audio",
  "libraries/file_system",
  "subsystems/graphics",
  "subsystems/task",
  "subsystems/users",
  "libraries/peripherals",
  "subsystems/memory",
  "subsystems/time",
  "libraries/abi/definitions",
  "libraries/abi/declarations",
  "subsystems/virtual_file_system",
  "libraries/little_fs",
  "executables/file_manager",
  "executables/shell/command_line",
  "libraries/executable",
  "executables/wasm",
  "executables/wasm/tests/wasm_test",
  "executables/shell/graphical",
  "executables/terminal",
  "executables/settings",
  "executables/debug",
  "executables/pixel_painter",
  "executables/text_editor",
  "libraries/authentication",
  "subsystems/network",
  "libraries/debug_protocol",
  "libraries/synchronization",
  "subsystems/task/task_macros",
  "subsystems/log",
  "examples/native",
  "executables/calculator",
  "examples/wasm",
  "libraries/bootsplash",
  "drivers/core",
  "drivers/espressif",
  "drivers/native",
  "drivers/headless",
  "drivers/shared",
  "drivers/std",
  "drivers/wasm",

  "libraries/testing",
  "libraries/device",
  "executables/weather",
  "executables/clock",
  "executables/synth",
  "subsystems/graphics/bindings_generator",
  "tools/fs_image",
]

[patch.crates-io]
littlefs2-sys = { git = "https://github.com/AlixANNERAUD/littlefs2-sys.git", branch = "xila-littlefs-2.11" }
