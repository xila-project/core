[package]
name = "xila"
version = "0.1.0"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
edition = "2024"
resolver = "2"
rust-version = "1.90.0"
license = "Apache-2.0"
description = "An operating system for embedded systems written in Rust."

[profile.release-wasm]
inherits = "release"
opt-level = 's'
strip = true
lto = true

[profile.profiling]
inherits = "release"
debug = "full"
strip = false

[dependencies]
# - Always included
embedded-i18n = { workspace = true }


# - Host
audio = { workspace = true, optional = true }
abi_declarations = { workspace = true, optional = true }
abi_definitions = { workspace = true, optional = true }
little_fs = { workspace = true, optional = true }
virtual_file_system = { workspace = true, optional = true }
graphics = { workspace = true, optional = true }
task = { workspace = true, optional = true }
time = { workspace = true, optional = true }
users = { workspace = true, optional = true }
memory = { workspace = true, optional = true }
target = { workspace = true, optional = true }
executable = { workspace = true, optional = true }
file_system = { workspace = true, optional = true }
authentication = { workspace = true, optional = true }
log = { workspace = true, optional = true }
shared = { workspace = true, optional = true }
synchronization = { workspace = true, optional = true }
bootsplash = { workspace = true, optional = true }
network = { workspace = true, optional = true }

[features]
default = [
  "dep:abi_declarations",
  "dep:abi_definitions",
  "dep:little_fs",
  "dep:virtual_file_system",
  "dep:task",
  "dep:time",
  "dep:users",
  "dep:memory",
  "dep:target",
  "dep:executable",
  "dep:file_system",
  "dep:authentication",
  "dep:log",
  "dep:shared",
  "dep:synchronization",
  "abi_definitions",
  "dep:network",
]

executable_building = ["executable/building"]
audio = ["dep:audio"]
abi_definitions = ["dep:abi_definitions"]
bootsplash = ["dep:bootsplash"]
graphics = ["dep:graphics", "executable/graphics"]
graphics_rendering_rgb565 = ["graphics", "graphics/rendering_rgb565"]
graphics_rendering_xrgb8888 = ["graphics", "graphics/rendering_xrgb8888"]


[workspace.dependencies]
application_metadata = { path = "modules/application_metadata" }
audio = { path = "modules/audio" }
nanoaudio = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-cpal = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-web = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-synth = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
abi_declarations = { path = "modules/abi/declarations" }
abi_definitions = { path = "modules/abi/definitions" }
little_fs = { path = "modules/little_fs" }
virtual_file_system = { path = "modules/virtual_file_system" }
graphics = { path = "modules/graphics" }
time = { path = "modules/time" }
task = { path = "modules/task" }
users = { path = "modules/users" }
memory = { path = "modules/memory" }
executable = { path = "modules/executable" }
file_system = { path = "modules/file_system" }
authentication = { path = "modules/authentication" }
log = { path = "modules/log" }
shared = { path = "modules/shared" }
synchronization = { path = "modules/synchronization" }
target = { path = "modules/target" }
network = { path = "modules/network" }
peripherals = { path = "modules/peripherals" }
bootsplash = { path = "modules/bootsplash" }
embedded-i18n = { version = "=0.1.2", default-features = false, features = [
  "backend-json",
] }
testing = { path = "modules/testing" }
device = { path = "modules/device" }

# - Drivers
drivers_core = { path = "drivers/core" }
drivers_espressif = { path = "drivers/espressif" }
drivers_native = { path = "drivers/native" }
drivers_shared = { path = "drivers/shared" }
drivers_std = { path = "drivers/std" }
drivers_wasm = { path = "drivers/wasm" }

# - Executables
file_manager = { path = "executables/file_manager" }
command_line_shell = { path = "executables/shell/command_line" }
graphical_shell = { path = "executables/shell/graphical" }
wasm = { path = "executables/wasm" }
terminal = { path = "executables/terminal" }
settings = { path = "executables/settings" }
pixel_painter = { path = "executables/pixel_painter" }
calculator = { path = "executables/calculator" }
weather = { path = "executables/weather" }
clock = { path = "executables/clock" }
synth = { path = "executables/synth" }

# - External crates
embedded-hal = { version = "1", default-features = false }
miniserde = { version = "0.1" }
bindgen = { version = "0.73" }
cbindgen = { version = "0.29" }
syn = { version = "3.0" }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
lvgl_rust_sys = { git = "https://github.com/Xila-Project/lvgl_rust_sys.git", rev = "fea1e05fc215e4f9263da97c8837210a0f72bd31", default-features = false }
embassy-executor = { version = "0.10", default-features = false }
embassy-futures = { version = "0.1" }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5" }
critical-section = { version = "1.2" }
smoltcp = { version = "0.13" }
linked_list_allocator = { version = "0.10", default-features = false, features = [
  "const_mut_refs",
] }
smol_str = { version = "0.3" }
darling = { version = "0.24" }
regex = { version = "1" }
embedded-io-async = { version = "0.7", features = ["alloc"] }
embedded-io = { version = "0.7", features = ["alloc"] }
embedded-tls = { version = "0.19", default-features = false, features = [
  "alloc",
] }
getargs-derive = { git = "https://github.com/AlixANNERAUD/getargs-derive.git", rev = "65b20961504ad5ba387ea13f0e9501036941ab17" } # v0.1.0

[workspace]
members = [
  "modules/application_metadata",
  "modules/audio",
  "modules/file_system",
  "modules/graphics",
  "modules/task",
  "modules/users",
  "modules/peripherals",
  "modules/memory",
  "modules/time",
  "modules/abi/definitions",
  "modules/abi/declarations",
  "modules/virtual_file_system",
  "modules/little_fs",
  "modules/target",
  "executables/file_manager",
  "executables/shell/command_line",
  "modules/executable",
  "executables/wasm",
  "executables/wasm/tests/wasm_test",
  "executables/shell/graphical",
  "executables/terminal",
  "executables/settings",
  "executables/pixel_painter",
  "modules/authentication",
  "modules/network",
  "modules/synchronization",
  "modules/task/task_macros",
  "modules/log",
  "examples/native",
  "executables/calculator",
  "examples/wasm",
  "modules/bootsplash",
  "drivers/core",
  "drivers/espressif",
  "drivers/native",
  "drivers/shared",
  "drivers/std",
  "drivers/wasm",

  "modules/graphics/fonts_generator",
  "modules/testing",
  "modules/device",
  "executables/weather",
  "executables/clock",
  "executables/synth",
  "modules/graphics/bindings_generator",
  "tools/fs_image",
]

[patch.crates-io]
littlefs2-sys = { git = "https://github.com/AlixANNERAUD/littlefs2-sys.git", branch = "xila-littlefs-2.11" }
