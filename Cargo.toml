[profile.release-wasm]
inherits = "release"
opt-level = 's'
strip = true
lto = true

[profile.profiling]
inherits = "release"
debug = "full"
strip = false

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/xila-project/core"

[workspace.dependencies]
native_loader = { package = "xila-native-loader", path = "libraries/native_loader" }
xila_version = { package = "xila-version", path = "libraries/version" }
stackful = { package = "xila-stackful", path = "libraries/stackful" }
xila = { path = "core" }
xila_http = { path = "libraries/http", default-features = false }
audio = { package = "xila-audio", path = "libraries/audio" }
drivers_neural_network = { package = "xila-drivers-neural-network", path = "drivers/neural_network" }
neural_network = { package = "xila-neural-network", path = "libraries/neural_network" }
nanoaudio = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
c_support = { package = "xila-c-support", path = "libraries/c_support" }
abi_application = { package = "xila-abi-application", path = "libraries/abi/application" }
little_fs = { package = "xila-little-fs", path = "libraries/little_fs" }
memory_file_system = { package = "xila-memory-file-system", path = "libraries/memory_file_system" }
virtual_file_system = { package = "xila-virtual-file-system", path = "subsystems/virtual_file_system" }
graphics = { package = "xila-graphics", path = "subsystems/graphics" }
graphics_bindgen = { package = "xila-graphics-bindgen", path = "subsystems/graphics/bindings_generator" }
time = { package = "xila-time", path = "subsystems/time" }
task = { package = "xila-task", path = "subsystems/task" }
lifecycle = { package = "xila-lifecycle", path = "subsystems/lifecycle" }
users = { package = "xila-users", path = "subsystems/users" }
memory = { package = "xila-memory", path = "subsystems/memory" }
executable = { package = "xila-executable", path = "libraries/executable" }
file_system = { package = "xila-file-system", path = "libraries/file_system" }
io_error = { package = "xila-io-error", path = "libraries/io_error" }
authentication = { package = "xila-authentication", path = "libraries/authentication" }
log = { package = "xila-log", path = "subsystems/log" }
shared = { package = "xila-shared", path = "libraries/shared" }
synchronization = { package = "xila-synchronization", path = "libraries/synchronization" }
network = { package = "xila-network", path = "subsystems/network" }
debug_protocol = { package = "xila-debug-protocol", path = "libraries/debug_protocol" }
peripherals = { package = "xila-peripherals", path = "libraries/peripherals" }
bootsplash = { package = "xila-bootsplash", path = "libraries/bootsplash" }
embedded-i18n = { version = "=0.2.0", default-features = false, features = [
  "backend-json",
] }
testing = { package = "xila-testing", path = "libraries/testing" }
testing_support = { package = "xila-testing-support", path = "libraries/testing/support" }
device = { package = "xila-device", path = "devices" }

# - Drivers
drivers_core = { package = "xila-drivers-core", path = "drivers/core" }
drivers_peripherals = { package = "xila-drivers-peripherals", path = "drivers/peripherals" }

# - Executables

# - External crates
embedded-hal = { version = "1", default-features = false }
embedded-hal-async = { version = "1", default-features = false }
miniserde = { version = "0.1", default-features = false }
cbindgen = { version = "0.29" }
syn = { version = "3.0" }
prettyplease = "0.3"
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
# Raw bindings and the safe layer come from the same lvgl-rust release: the
# safe layer defines LVGL's OBJ_ID hooks for the bindings' library.
lvgl_rust_sys = { version = "0.3.1", package = "lvgl-rust-sys", default-features = false }
lvgl-rust = { version = "0.3.1", default-features = false }
# Fork branch `xila`: corosensei 0.3.4 with the Xtensa backend (proposed in the issue
# Amanieu/corosensei#79) and the Cortex-M `d8`-`d15` clobber fix (Amanieu/corosensei#80). Drop the
# fork once both are released.
corosensei = { git = "https://github.com/AlixANNERAUD/corosensei.git", rev = "994bad103b32b88319797352f21ade0508e239fc", default-features = false }
embassy-executor = { version = "0.10", default-features = false }
embassy-futures = { version = "0.1" }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5" }
critical-section = { version = "1.2" }
# Compare-and-swap for targets without it (ESP32-C2/C3/S2). Libraries never
# pick its backend: the firmware enables `unsafe-assume-single-core` or
# `critical-section` (esp-hal already does for these chips).
portable-atomic = { version = "1", default-features = false }
portable-atomic-util = { version = "0.2", default-features = false, features = [
  "alloc",
] }
smoltcp = { version = "0.14", default-features = false }
darling = { version = "0.24" }
regex = { version = "1" }
embedded-io-async = { version = "0.7", features = ["alloc"] }
embedded-io = { version = "0.7", features = ["alloc"] }
embedded-tls = { version = "0.19", default-features = false, features = [
  "alloc",
] }
getargs-derive = { git = "https://github.com/AlixANNERAUD/getargs-derive.git", rev = "65b20961504ad5ba387ea13f0e9501036941ab17" } # v0.1.0
mbrman = { version = "0.7", default-features = false }

[workspace]
resolver = "3"
default-members = ["core"]
members = [
  "libraries/stackful",
  "libraries/native_loader",
  "libraries/version",
  "core",
  "libraries/testing",
  "libraries/testing/support",
  "libraries/shared",
  "libraries/http",
  "libraries/firmware_update",
  "libraries/audio",
  "libraries/neural_network",
  "drivers/neural_network",
  "libraries/file_system",
  "libraries/io_error",
  "subsystems/graphics",
  "subsystems/task",
  "subsystems/users",
  "libraries/peripherals",
  "drivers/peripherals",
  "subsystems/memory",
  "subsystems/time",
  "libraries/abi/application",
  "libraries/abi/application/c_tests",
  "libraries/c_support",
  "subsystems/virtual_file_system",
  "libraries/little_fs",
  "libraries/memory_file_system",
  "libraries/executable",
  "libraries/authentication",
  "subsystems/network",
  "libraries/debug_protocol",
  "libraries/synchronization",
  "subsystems/task/task_macros",
  "subsystems/log",
  "subsystems/lifecycle",
  "libraries/bootsplash",
  "drivers/core",

  "devices",
  "subsystems/graphics/bindings_generator",
]

[patch.crates-io]
littlefs2-sys = { path = "libraries/littlefs2_sys" }
