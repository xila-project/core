[package]
name = "xila-wasm"
version = "0.1.0"
edition = "2024"
build = "build/main.rs"

[dependencies]
application_metadata = { workspace = true }
wasmi = { version = "2.0.0", default-features = false, features = [
  "validate",
  "memory64",
  "auto-dispatch",
  "prefer-btree-collections",
  "extra-checks",
], optional = true }
xila = { path = "../../", optional = true }
getargs-derive = { workspace = true, optional = true }
getargs = { version = "0.5", optional = true }
embassy-time = { workspace = true, optional = true }

[features]
guest = []
c_bindings = ["guest", "graphics", "dep:cbindgen"]
default_guest = ["guest", "graphics", "c_bindings", "memory_32"]
host = [
  "dep:wasmi",
  "dep:xila",
  "dep:getargs-derive",
  "dep:getargs",
  "dep:embassy-time",
]
default = ["host", "memory_32"]
memory_32 = []
memory_64 = []
graphics = [
  "xila?/graphics",
  "dep:graphics_bindgen",
  "dep:lvgl_rust_sys",
  "dep:quote",
  "dep:syn",
  "dep:proc-macro2",
]

[build-dependencies]
graphics_bindgen = { package = "xila-graphics-bindgen", path = "../../subsystems/graphics/bindings_generator", optional = true }
lvgl_rust_sys = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
syn = { workspace = true, features = ["full", "extra-traits"], optional = true }
proc-macro2 = { workspace = true, optional = true }
cbindgen = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
drivers_native = { workspace = true }
drivers_core = { workspace = true }
drivers_shared = { workspace = true }
drivers_std = { workspace = true }
abi_definitions = { workspace = true }
command_line_shell = { workspace = true }
executable = { workspace = true, features = ["building"] }
testing = { workspace = true }
audio = { workspace = true }
wat = "1"

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[lib]
name = "wasm"
