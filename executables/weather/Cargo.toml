[package]
name = "xila-weather"
version = "0.1.0"
edition = "2024"

[dependencies]
application_metadata = { workspace = true }
embedded-i18n = { workspace = true }
miniserde = { workspace = true }
shared = { workspace = true }
task = { workspace = true }
virtual_file_system = { workspace = true }
file_system = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm = { workspace = true, default-features = false, features = [
  "guest",
  "graphics",
  "memory_32",
] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
xila = { workspace = true, features = [
  "graphics",
  "executable_building",
  "graphics_rendering_xrgb8888",
] }
drivers_core = { workspace = true }
drivers_std = { workspace = true }
drivers_shared = { workspace = true }
drivers_native = { workspace = true }
testing = { workspace = true }
wasm = { workspace = true, features = ["graphics"] }

[[test]]
name = "build_test"
path = "tests/build_test.rs"

[[test]]
name = "weather_test"
path = "tests/test.rs"

[[bin]]
name = "weather"
path = "src/main.rs"

[lib]
name = "weather"
