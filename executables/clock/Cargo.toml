[package]
name = "xila-clock"
version = "0.1.0"
edition = "2024"
description = "A bounded Clock application for Xila's WebAssembly runtime."
license = "GPL-2.0-only"

[dependencies]
application_metadata = { workspace = true }
embedded-i18n = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm = { workspace = true, default-features = false, features = [
  "guest",
  "graphics",
  "memory_32",
] }

[[bin]]
name = "clock"
path = "src/main.rs"

[lib]
name = "clock"
