name: Bug report
description: Report a reproducible defect or regression in Xila.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Search existing issues first, and do not disclose security vulnerabilities or secrets in a public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and its impact.
      placeholder: The filesystem returns ... when ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should Xila do instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example or command. For intermittent bugs, explain when or how often they occur.
      placeholder: |
        1. Build with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Affected targets
      description: Select everything relevant; untested targets should not be selected.
      multiple: true
      options:
        - Native host (Linux)
        - Browser runtime (wasm32-unknown-unknown)
        - WASI guest application (wasm32-wasip1)
        - Embedded hardware (ESP32, nRF, STM32, etc.)
        - Other / unknown
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Xila revision
      description: Commit SHA, release/tag, or branch where this happens.
      placeholder: main at <commit SHA>
  - type: textarea
    id: environment
    attributes:
      label: Environment and configuration
      description: Hardware/board, OS, toolchain, feature flags, locale, and relevant dependencies.
  - type: textarea
    id: logs
    attributes:
      label: Logs, errors, or screenshots
      description: Redact tokens, credentials, personal information, and private paths before posting.
      render: shell
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Suspected cause, regression range, workaround, or related issues.
