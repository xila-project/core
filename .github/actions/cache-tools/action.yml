name: Cache tools
description: Ensure Actions uses fast zstd archives instead of silently falling back to gzip
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # The current image ships zstd. Keep this optional fallback for older
        # mutable image tags; cache optimization must not block validation.
        if ! command -v zstd > /dev/null; then
          if ! (apt-get update -qq && apt-get install -y --no-install-recommends zstd); then
            echo '::warning::Unable to install optional zstd; Actions will fall back to gzip.'
          fi
        fi
        if command -v zstd > /dev/null; then
          zstd --version
        fi
