name: Cache tools
description: Ensure hosted runners use fast zstd archives for Rust caches
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if ! command -v zstd > /dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd
        fi
        zstd --version
