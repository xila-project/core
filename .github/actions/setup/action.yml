name: "Setup"
description: "Install mise-managed tools, dependencies, and CI caches on hosted runners"

inputs:
  profile:
    description: "Setup profile: 'full' (default) or 'minimal' for lightweight jobs (format only)."
    required: false
    default: full
  node-dependencies:
    description: "Install npm tools (required by font generation); disable for ABI-only Rust jobs."
    required: false
    default: "true"
  lockfile-manifests:
    description: "Newline-separated manifests whose lockfiles this job validates."
    required: false
    default: Cargo.toml
  cache-workspaces:
    description: "Cargo workspace -> target directory mappings for the job's Rust cache."
    required: false
    default: ". -> target"
  cache-key:
    description: "Stable Rust cache identity for this workload; separate locale/feature variants."
    required: false
    default: default
  nightly-toolchain:
    description: "Install the pinned nightly Rust toolchain and Miri targets."
    required: false
    default: "false"
  mise-environment:
    description: "Comma-separated mise config environment(s) for this job."
    required: false
    default: host
  bootstrap-packages:
    description: "Apply selected environment's system packages."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup | Select mise environment
      shell: bash
      env:
        SELECTED_MISE_ENV: ${{ inputs.mise-environment }}
      run: echo "MISE_ENV=$SELECTED_MISE_ENV" >> "$GITHUB_ENV"

    - name: Setup | Install mise tools
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

    - name: Setup | Export toolchain pins
      shell: bash
      run: |
        mise_env="$(mise env --json)"
        stable="$(jq -r '.XILA_RUST_TOOLCHAIN' <<< "$mise_env")"
        nightly="$(jq -r '.XILA_NIGHTLY_TOOLCHAIN' <<< "$mise_env")"
        echo "XILA_RUST_TOOLCHAIN=$stable" >> "$GITHUB_ENV"
        echo "XILA_NIGHTLY_TOOLCHAIN=$nightly" >> "$GITHUB_ENV"
        echo "RUSTUP_TOOLCHAIN=$stable" >> "$GITHUB_ENV"

    - name: Setup | Install nightly Rust components
      if: inputs.nightly-toolchain == 'true'
      shell: bash
      run: mise run install-nightly

    - name: Setup | Bootstrap selected system dependencies
      if: inputs.profile != 'minimal' && inputs.bootstrap-packages == 'true'
      shell: bash
      run: mise bootstrap packages apply --manager apt --update --yes

    - name: Setup | Cache compression
      if: inputs.profile != 'minimal'
      uses: ./.github/actions/cache-tools

    - name: Setup | Cache diagnostics
      if: inputs.profile != 'minimal'
      uses: ./.github/actions/cache-diagnostics

    - name: Setup | sccache
      if: inputs.profile != 'minimal'
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      with:
        version: v0.18.0

    - name: Setup | Export sccache env
      if: inputs.profile != 'minimal'
      shell: bash
      run: |
        echo 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_RW_MODE=${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}" >> "$GITHUB_ENV"

    - name: Setup | npm cache
      if: inputs.node-dependencies == 'true'
      id: npm-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Setup | Report npm cache
      if: inputs.node-dependencies == 'true'
      shell: bash
      run: 'echo "npm cache exact hit: ${{ steps.npm-cache.outputs.cache-hit }}"'

    - name: Setup | Rust cache
      if: inputs.profile != 'minimal'
      id: rust-cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: ${{ inputs.cache-workspaces }}
        # The action itself hashes Cargo manifests/lockfiles, rustc, .cargo
        # config, and RUST_* environment. Keep comments/toolchain manifest
        # formatting out of this identity; cache-bin is in the image already.
        shared-key: ${{ inputs.cache-key }}
        cache-bin: "false"
        # PRs restore main's caches without filling the quota with PR copies.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Setup | Report Rust cache
      if: inputs.profile != 'minimal'
      shell: bash
      run: 'echo "Rust cache exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"'

    - name: Setup | Validate lockfiles
      if: inputs.profile != 'minimal'
      shell: bash
      env:
        LOCKFILE_MANIFESTS: ${{ inputs.lockfile-manifests }}
      run: |
        while IFS= read -r manifest; do
          [[ -z "$manifest" ]] && continue
          cargo metadata --locked --format-version 1 --manifest-path "$manifest" > /dev/null
        done <<< "$LOCKFILE_MANIFESTS"

    - name: Setup | npm dependencies
      if: inputs.node-dependencies == 'true'
      shell: bash
      run: npm ci
