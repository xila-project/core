name: "Setup"
description: "Cache and validate tools in the Xila development image"

inputs:
  profile:
    description: "Setup profile: 'full' (default) or 'minimal' for lightweight jobs (format only)."
    required: false
    default: full
  cache-workspaces:
    description: "Cargo workspace -> target directory mappings for the job's Rust cache."
    required: false
    default: ". -> target"
  cache-key:
    description: "Stable Rust cache identity for this workload; separate locale/feature variants."
    required: false
    default: default

runs:
  using: "composite"
  steps:
    - name: Setup | Read toolchain pins
      shell: bash
      run: |
        source development/toolchains.env
        echo "XILA_RUST_TOOLCHAIN=$XILA_RUST_TOOLCHAIN" >> "$GITHUB_ENV"
        echo "XILA_NIGHTLY_TOOLCHAIN=$XILA_NIGHTLY_TOOLCHAIN" >> "$GITHUB_ENV"
        echo "RUSTUP_TOOLCHAIN=$XILA_RUST_TOOLCHAIN" >> "$GITHUB_ENV"

    - name: Setup | sccache
      if: inputs.profile != 'minimal'
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Setup | Export sccache env
      if: inputs.profile != 'minimal'
      shell: bash
      run: |
        echo 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_RW_MODE=${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}" >> "$GITHUB_ENV"

    - name: Setup | npm cache
      id: npm-cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Setup | Report npm cache
      shell: bash
      run: 'echo "npm cache exact hit: ${{ steps.npm-cache.outputs.cache-hit }}"'

    - name: Setup | Rust cache
      if: inputs.profile != 'minimal'
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.cache-workspaces }}
        # The action itself hashes Cargo manifests/lockfiles, rustc, .cargo
        # config, and RUST_* environment. Keep comments/toolchain manifest
        # formatting out of this identity; cache-bin is in the image already.
        shared-key: ${{ inputs.cache-key }}
        cache-bin: "false"
        # PRs restore main's caches without filling the quota with PR copies.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Setup | Report Rust cache
      if: inputs.profile != 'minimal'
      shell: bash
      run: 'echo "Rust cache exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"'

    - name: Setup | Validate lockfiles
      if: inputs.profile != 'minimal'
      shell: bash
      run: |
        for manifest in Cargo.toml executables/wasm/tests/translation/Cargo.toml tools/profiling/Cargo.toml; do
          cargo metadata --locked --format-version 1 --manifest-path "$manifest" > /dev/null
        done

    - name: Setup | npm dependencies
      shell: bash
      run: npm ci
