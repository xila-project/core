name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_ONLY

jobs:
  profile:
    name: Cargo profile benchmark (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [default, line-tables-only]
    env:
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev
      - run: mise run install-tools
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: benchmark-profile-${{ matrix.profile }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Benchmark default debug profiles
        if: matrix.profile == 'default'
        run: mise run ci:benchmark-profile
      - name: Benchmark reduced debug profiles
        if: matrix.profile == 'line-tables-only'
        env:
          CARGO_BENCH_PROFILE: line-tables-only
        run: mise run ci:benchmark-profile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-profile-timings-${{ matrix.profile }}
          path: target/cargo-timings/
          if-no-files-found: warn

  test-runner:
    name: Test runner benchmark (${{ matrix.runner }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [cargo-test, nextest]
    env:
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev
      - run: mise run install-tools
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: benchmark-test-runner-${{ matrix.runner }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned nextest for benchmark
        if: matrix.runner == 'nextest'
        run: mise run ci:benchmark-install-nextest
      - name: Prepare benchmark results
        run: mkdir -p benchmark-results
      - name: Install GNU time
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends time
      - name: Compile test binaries
        run: |
          /usr/bin/time -v -o "benchmark-results/compile-${{ matrix.runner }}.txt" mise run ci:benchmark-compile
          cat "benchmark-results/compile-${{ matrix.runner }}.txt"
      - name: Benchmark cargo test execution
        if: matrix.runner == 'cargo-test'
        run: |
          /usr/bin/time -v -o benchmark-results/test-execution-cargo-test.txt mise run ci:benchmark-cargo-test
          cat benchmark-results/test-execution-cargo-test.txt
      - name: Benchmark nextest execution
        if: matrix.runner == 'nextest'
        run: |
          /usr/bin/time -v -o benchmark-results/test-execution-nextest.txt mise run ci:benchmark-nextest
          cat benchmark-results/test-execution-nextest.txt
      - name: Benchmark doctests
        run: |
          /usr/bin/time -v -o "benchmark-results/doctests-${{ matrix.runner }}.txt" mise run ci:benchmark-doctests
          cat "benchmark-results/doctests-${{ matrix.runner }}.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-test-runner-timings-${{ matrix.runner }}
          path: |
            target/cargo-timings/
            benchmark-results/
          if-no-files-found: warn
