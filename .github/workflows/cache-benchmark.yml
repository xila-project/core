name: Cache benchmark

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Fresh namespace = cold; repeat same namespace/ref = warm. Experiment caches consume repository quota."
        type: string
        default: "480-v1"
      strategy:
        description: "One candidate at a time by default; all costs four workspace test builds."
        type: choice
        default: dependencies
        options: [dependencies, combined, sccache, workspace, all]

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Cache experiment (${{ matrix.strategy }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Isolate candidates from each other's GHAC rate limits and CPU contention.
      max-parallel: 1
      matrix:
        strategy: ${{ fromJSON(inputs.strategy == 'all' && '["dependencies","combined","sccache","workspace"]' || format('["{0}"]', inputs.strategy)) }}
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      SCCACHE_GHA_VERSION: experiment-${{ inputs.namespace }}-${{ matrix.strategy }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup | Install mise tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Setup | Select pinned Rust toolchain
        run: echo "RUSTUP_TOOLCHAIN=$(mise env --json | jq -r '.XILA_RUST_TOOLCHAIN')" >> "$GITHUB_ENV"

      - name: Setup | Bootstrap native build dependencies
        run: mise bootstrap packages apply --manager apt --update --yes

      - uses: ./.github/actions/cache-tools

      - name: Setup | Fonts dependencies
        run: npm ci

      - uses: ./.github/actions/cache-diagnostics
        if: matrix.strategy != 'dependencies'

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        if: matrix.strategy != 'dependencies'
        with:
          version: v0.18.0

      - name: Setup | Compiler wrapper
        if: matrix.strategy == 'dependencies'
        run: echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"

      - name: Cache | Cargo dependencies or source-keyed workspace
        if: matrix.strategy != 'sccache'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: experiment-${{ inputs.namespace }}
          # In this rust-cache revision shared-key overrides key, not combines
          # with it. Put source identity in the effective shared key itself.
          shared-key: ${{ matrix.strategy == 'workspace' && format('workspace-{0}', github.sha) || matrix.strategy }}
          cache-bin: "false"
          cache-workspace-crates: ${{ matrix.strategy == 'workspace' }}
          # Workspace artifacts require a changing source key (#348). Checkout
          # mtimes can still invalidate them: measure, don't assume a no-op.

      - name: Run | Identical host workload
        run: |
          cargo run --locked --package fonts_generator
          cargo test --locked --workspace --timings

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cache-timings-${{ matrix.strategy }}
          path: target/cargo-timings/
          if-no-files-found: warn
