name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    # The PR files API is capped at 3000 files; larger PRs run the full suite.
    if: github.event_name == 'pull_request' && github.event.pull_request.changed_files <= 3000
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      translation: ${{ steps.filter.outputs.translation }}
      format: ${{ steps.filter.outputs.format }}
      host: ${{ steps.filter.outputs.host }}
      guest: ${{ steps.filter.outputs.guest }}
      localization: ${{ steps.filter.outputs.localization }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'modules/**'
              - '**/Cargo.{toml,lock}'
              - '**/.cargo/**'
              - '**/Makefile.toml'
              - '**/build.rs'
              - '**/build/**'
              - '**/rust-toolchain{,.toml}'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'devbox.{json,lock}'
              - '.devbox-version'
              - 'development/**'
              - 'package{,-lock}.json'
              - '**/.{gitignore,editorconfig,npmrc}'
              - '**/{.,}taplo.toml'
              - '**/{.,}rustfmt.toml'
              - '**/.prettier*'
              - '**/prettier.config.*'
            translation:
              - *shared
              - 'executables/wasm/src/host/translation/**'
              - 'executables/wasm/src/host/graphics/{error,marshal,marshal_tests}.rs'
              - 'executables/wasm/src/host/wasi/{poll_memory,poll_tests,types}.rs'
              - 'executables/wasm/tests/translation/**'
            format:
              - *shared
              - '**/*.{rs,toml,json}'
            host:
              - *shared
              - 'tools/profiling/**'
              - 'src/**'
              - 'drivers/**'
              - 'executables/**'
              - 'examples/native/**'
              - 'examples/wasm/**/*.rs'
            guest:
              - *shared
              - 'src/**'
              - 'drivers/{core,shared,wasm}/**'
              - 'executables/!(wasm)/**'
              - 'executables/wasm/src/guest/**'
              - 'executables/wasm/src/lib.rs'
              - 'examples/wasm/**'
            localization:
              - *shared
              - '**/*.rs'
              - '**/*.ftl'
              - '**/locales/**/*.json'
              - '**/locale/**'
              - '**/i18n/**'
              - '**/localization/**'
              - 'executables/wasm/src/host/translation/**'
              - 'executables/wasm/tests/translation/**'

  localization:
    name: Localization checks (${{ matrix.locale }})
    needs: [changes]
    # Rust-only changes can introduce translation keys; docs-only PRs skip
    # these builds. Main/manual runs and filter failures still run both locales.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.localization == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        locale: [en, fr]
    env:
      EMBEDDED_I18N_LOCALE: ${{ matrix.locale }}
      EMBEDDED_I18N_STRICT: "1"
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check | Strict host and guest translations
        run: cargo make check-localization

  # Job-level skips satisfy required checks. PR runs are path-filtered and
  # main/manual runs and filter failures run the full suite; !cancelled()
  # permits runs after a skipped dependency. Heavy steps run off PRs only.
  wasm-translation:
    name: WASM ABI checks (${{ matrix.memory }})
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.translation == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        memory: ${{ fromJSON(github.event_name == 'pull_request' && '["memory_32"]' || '["memory_32", "memory_64"]') }}
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-workspaces: "executables/wasm/tests/translation -> target"

      # Keep main's plain dependency artifacts compatible with PR test builds.
      - name: Check | Translation tests
        run: >-
          cargo +${XILA_RUST_TOOLCHAIN} test --locked
          --manifest-path executables/wasm/tests/translation/Cargo.toml
          --no-default-features --features ${{ matrix.memory }}

      - name: Check | Borrowing compile-fail doctests
        run: >-
          cargo +${XILA_RUST_TOOLCHAIN} test --locked --doc
          --manifest-path executables/wasm/tests/translation/Cargo.toml
          --no-default-features --features ${{ matrix.memory }}

  wasm-extended:
    name: WASM ABI coverage and Miri (${{ matrix.memory }})
    needs: [wasm-translation]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        memory: [memory_32, memory_64]
    env:
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/executables/wasm/tests/translation/target/llvm-cov-target
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-workspaces: "executables/wasm/tests/translation -> target/llvm-cov-target"

      - name: Check | Translation coverage
        run: >-
          cargo +${XILA_RUST_TOOLCHAIN} llvm-cov --locked
          --manifest-path executables/wasm/tests/translation/Cargo.toml
          --no-default-features --features ${{ matrix.memory }}
          --ignore-filename-regex '(tests\.rs|tests/translation/src/lib\.rs)$'
          --fail-under-lines 100 --fail-under-functions 100

      - name: Check | Translation Miri
        run: >-
          cargo +${XILA_NIGHTLY_TOOLCHAIN} miri test --locked
          --manifest-path executables/wasm/tests/translation/Cargo.toml
          --no-default-features --features ${{ matrix.memory }}

      - name: Check | 64-bit guest on 32-bit host (Miri)
        if: matrix.memory == 'memory_64'
        run: >-
          cargo +${XILA_NIGHTLY_TOOLCHAIN} miri test --locked
          --manifest-path executables/wasm/tests/translation/Cargo.toml
          --no-default-features --features memory_64
          --target i686-unknown-linux-gnu

      - name: Check | Little-endian ABI on big-endian host (Miri)
        if: matrix.memory == 'memory_32'
        run: >-
          cargo +${XILA_NIGHTLY_TOOLCHAIN} miri test --locked
          --manifest-path executables/wasm/tests/translation/Cargo.toml
          --no-default-features --features memory_32
          --target powerpc-unknown-linux-gnu

  format:
    name: Format checks
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.format == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          profile: minimal

      - name: Check | Formatting (TOML)
        run: cargo make --skip-init-end-tasks format-toml --check

      - name: Check | Formatting (Rust)
        run: cargo make --skip-init-end-tasks format-rust -- --check

      - name: Check | Formatting (JSON)
        run: npm exec prettier -- --check "**/*.json"

  host-clippy:
    name: Host checks (Clippy)
    needs: [changes, format, localization]
    if: >-
      ${{ !cancelled() && (needs.format.result == 'success' || needs.format.result == 'skipped') &&
          (needs.changes.result != 'success' || needs.changes.outputs.host == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check | Translation coverage gate
        if: needs.localization.result != 'success' && needs.localization.result != 'skipped'
        run: |
          echo "::error::Strict translation coverage did not pass."
          exit 1

      - name: Setup | Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check | Clippy (Host)
        run: cargo make clippy-host

      - name: Check | Clippy (Host - Wasmi)
        run: cargo +${XILA_RUST_TOOLCHAIN} clippy -p wasm --features graphics,xila/graphics_rendering_xrgb8888 --target x86_64-unknown-linux-gnu

  host-test:
    name: Host checks (Tests)
    needs: [changes, format, localization]
    if: >-
      ${{ !cancelled() && (needs.format.result == 'success' || needs.format.result == 'skipped') &&
          (needs.changes.result != 'success' || needs.changes.outputs.host == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check | Translation coverage gate
        if: needs.localization.result != 'success' && needs.localization.result != 'skipped'
        run: |
          echo "::error::Strict translation coverage did not pass."
          exit 1

      - name: Setup | Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-workspaces: |
            . -> target
            tools/profiling -> target

      - name: Check | Profiling runner
        run: |
          cargo fmt --manifest-path tools/profiling/Cargo.toml -- --check
          cargo clippy --manifest-path tools/profiling/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/profiling/Cargo.toml

      # Run the same plain tests on main and PRs so main saves a reusable cache.
      - name: Run | Test
        run: cargo make test

  host-coverage:
    name: Host coverage and profiling checks
    needs: [host-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov-target
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # Profiling builds into target/, coverage into its llvm-cov-target child.
          # Cache the parent once; the job-specific key isolates it from plain tests.
          cache-workspaces: ". -> target"

      - name: Setup | Generate fonts
        run: cargo make generate-fonts

      - name: Check | Profiling instrumentation
        run: |
          cargo test -p task -p drivers_std --lib --features task/test_harness,drivers_std/profiling,drivers_std/heaptrack
          cargo test -p native_example --bin native_example --features profiling,heaptrack

      - name: Run | Coverage
        run: |
          cargo make coverage --lcov --output-path lcov.info

      - name: Upload | Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required for private repos or protected branches
          slug: Xila-Project/Core
          files: lcov.info
          fail_ci_if_error: true

  host-audio-docs:
    name: Host checks (Audio, docs, build)
    needs: [changes, format, localization]
    if: >-
      ${{ !cancelled() && (needs.format.result == 'success' || needs.format.result == 'skipped') &&
          (needs.changes.result != 'success' || needs.changes.outputs.host == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check | Translation coverage gate
        if: needs.localization.result != 'success' && needs.localization.result != 'skipped'
        run: |
          echo "::error::Strict translation coverage did not pass."
          exit 1

      - name: Setup | Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup | Generate fonts
        run: cargo make generate-fonts

      - name: Check | Audio
        run: |
          cargo +${XILA_RUST_TOOLCHAIN} test -p audio -p synth
          cargo +${XILA_RUST_TOOLCHAIN} clippy -p audio -p drivers_native --features drivers_native/audio --all-targets -- -D warnings
          cargo +${XILA_RUST_TOOLCHAIN} test -p drivers_native --features audio --lib devices::audio::tests

      - name: Check | Documentation (Host)
        if: github.event_name != 'pull_request'
        run: RUSTDOCFLAGS="--deny warnings" cargo make doc-host

      - name: Check | Seed image generation and native import
        run: cargo test -p fs_image -p authentication -p native_example

      - name: Check | Browser seed streaming and disk manager
        run: node --test drivers/wasm/tests/seed.test.mjs examples/wasm/tests/disk_manager.test.mjs

      - name: Build | Example (Native)
        run: cargo make build -p native_example

  guest:
    name: Guest checks
    needs: [changes, format]
    if: >-
      ${{ !cancelled() && (needs.format.result == 'success' || needs.format.result == 'skipped') &&
          (needs.changes.result != 'success' || needs.changes.outputs.guest == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          trunk: ${{ github.event_name != 'pull_request' }}

      - name: Check | Clippy (Guest)
        run: cargo make clippy-guest

      - name: Check | Portable audio (WASM)
        run: cargo +${XILA_RUST_TOOLCHAIN} check -p audio -p drivers_wasm --features drivers_wasm/audio --target wasm32-unknown-unknown

      - name: Check | Documentation (Guest)
        if: github.event_name != 'pull_request'
        run: RUSTDOCFLAGS="--deny warnings" cargo make doc-guest

      - name: Build | Bundled applications (WASI)
        run: cargo make prepare-wasm-image

      - name: Check | Clock (WASI)
        run: cargo +${XILA_RUST_TOOLCHAIN} clippy -p clock --all-targets --target wasm32-wasip1 -- -D warnings

      - name: Check | Pixel Painter (WASI)
        run: cargo +${XILA_RUST_TOOLCHAIN} clippy -p pixel_painter --all-targets --target wasm32-wasip1 -- -D warnings

      - name: Cache | Trunk tools and dist
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          # Trunk downloads wasm-bindgen/wasm-opt into its ProjectDirs cache
          # (~/.cache/trunk/<tool>-<version>/); a version drift self-heals by
          # re-downloading the missing directory. dist/ is build output and is
          # rebuilt by `trunk build`, so it is intentionally not cached.
          path: |
            ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'development/toolchains.env') }}
          restore-keys: |
            trunk-tools-

      - name: Build | Example (WASM)
        if: github.event_name != 'pull_request'
        run: cd examples/wasm && RUSTUP_TOOLCHAIN="$XILA_NIGHTLY_TOOLCHAIN" trunk build
