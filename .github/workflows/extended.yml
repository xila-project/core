name: Extended validation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      core_ref:
        required: false
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false
    outputs:
      validated-sha:
        description: Commit SHA that passed every deep validation job
        value: ${{ jobs.release-gate.outputs.validated-sha }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Host coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISE_ENV: ci
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov-target
      XILA_APPLICATIONS_MANIFEST: ${{ github.workspace }}/.application-src/Cargo.toml
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-src
    steps:
      - name: "Setup | Checkout Core"
        uses: actions/checkout@v7
        with:
          repository: xila-project/core
          ref: ${{ inputs.core_ref || github.sha }}
          persist-credentials: false
      - name: "Setup | Checkout pinned applications"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 3f6c71017a543cfefc19bd54d2d8fdd59ebc8098
          path: .application-src
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@ab0393f7a1df988b8fcd13da38e013057e9c9de8
        with:
          cache-mode: objects
          cache-generation: v1-extended-coverage
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      - name: "Setup | Locked Node dependencies"
        run: mise run deps:npm
      - name: "Test | Host coverage"
        run: mise run ci:coverage
      - name: "Report | Upload coverage"
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Xila-Project/Core
          files: lcov.info
          fail_ci_if_error: true

  abi-deep:
    name: ABI coverage and Miri (${{ matrix.memory }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        memory: [memory_32, memory_64]
    env:
      MISE_ENV: ci
      CI_ABI_MEMORY: ${{ matrix.memory }}
    steps:
      - name: "Setup | Checkout Core"
        uses: actions/checkout@v7
        with:
          repository: xila-project/core
          ref: ${{ inputs.core_ref || github.sha }}
          persist-credentials: false
      - name: "Setup | Checkout pinned applications"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 3f6c71017a543cfefc19bd54d2d8fdd59ebc8098
          path: .application-src
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@ab0393f7a1df988b8fcd13da38e013057e9c9de8
        with:
          toolchain-task: ci:toolchain-nightly
          cache-mode: objects
          cache-generation: v1-extended-abi-${{ matrix.memory }}
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      - name: "Validate | ABI coverage thresholds"
        run: mise run ci:abi-coverage
      - name: "Test | Host Miri ABI"
        run: mise run ci:abi-miri
      - name: "Test | Cross-architecture Miri ABI"
        run: mise run ci:abi-miri-cross

  release-gate:
    name: Deep validation gate
    if: always()
    needs: [coverage, abi-deep]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validated-sha: ${{ steps.sha.outputs.validated-sha }}
    steps:
      - name: "Gate | Verify deep validation"
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          ABI_RESULT: ${{ needs.abi-deep.result }}
        run: |
          set -euo pipefail
          for result in "$COVERAGE_RESULT" "$ABI_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "::error::Deep validation finished with result: $result"
              exit 1
            fi
          done
      - name: "Report | Record validated commit"
        id: sha
        env:
          VALIDATED_CORE_REF: ${{ inputs.core_ref || github.sha }}
        run: echo "validated-sha=$VALIDATED_CORE_REF" >> "$GITHUB_OUTPUT"
