name: Deploy
# Build and deploy documentation and demonstrations to GitHub Pages.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xila-project/development-environment:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build | Documentation (Host)
        run: |
          cargo make doc-host
          mkdir -p ./pages/host/
          cp -r ./target/x86_64-unknown-linux-gnu/doc/* ./pages/host/

      - name: Build | Documentation (Guest)
        run: |
          cargo make doc-guest
          mkdir -p ./pages/guest/
          cp -r ./target/wasm32-unknown-unknown/doc/* ./pages/guest/

      # NOTE: en/fr must build separately. EMBEDDED_I18N_LOCALE is baked in
      # at compile time by the embedded-i18n proc macro (calculator/clock
      # strings), provisioned into separate LittleFS seed images, and
      # selects per-locale font subsets in generate-fonts. A single build
      # copied to both dirs would serve wrong-locale strings and miss
      # French glyphs. Shared setup (checkout, toolchains, docs) runs once
      # above; only the locale-dependent steps repeat per locale.
      - name: Build | WASM demonstration (en)
        env:
          EMBEDDED_I18N_LOCALE: en
        run: |
          cargo make generate-fonts
          cargo build -p calculator -p weather -p clock -p pixel_painter -p synth --target wasm32-wasip1 --release
          cargo make prepare-wasm-image
          cargo run -p fs_image -- target/seed/wasm/repeated.img 16777216 --bundle wasm --applications-dir target/wasm32-wasip1/release
          cmp target/seed/wasm/seed.img target/seed/wasm/repeated.img
          rm target/seed/wasm/repeated.img
          mkdir -p seed-images/$EMBEDDED_I18N_LOCALE
          cp target/seed/wasm/seed.img seed-images/$EMBEDDED_I18N_LOCALE/wasm.img
          cargo run -p fs_image -- seed-images/$EMBEDDED_I18N_LOCALE/native.img 16777216 --bundle native --applications-dir target/wasm32-wasip1/release
          cargo run -p fs_image -- target/seed/wasm/native-repeated.img 16777216 --bundle native --applications-dir target/wasm32-wasip1/release
          cmp seed-images/$EMBEDDED_I18N_LOCALE/native.img target/seed/wasm/native-repeated.img
          rm target/seed/wasm/native-repeated.img
          (cd examples/wasm && RUSTUP_TOOLCHAIN="$XILA_NIGHTLY_TOOLCHAIN" trunk build --release --public-url ./)
          mkdir -p pages/demonstrations/wasm/en/
          cp -r examples/wasm/dist/* pages/demonstrations/wasm/en/

      - name: Build | WASM demonstration (fr)
        env:
          EMBEDDED_I18N_LOCALE: fr
        run: |
          cargo make generate-fonts
          cargo build -p calculator -p weather -p clock -p pixel_painter -p synth --target wasm32-wasip1 --release
          cargo make prepare-wasm-image
          cargo run -p fs_image -- target/seed/wasm/repeated.img 16777216 --bundle wasm --applications-dir target/wasm32-wasip1/release
          cmp target/seed/wasm/seed.img target/seed/wasm/repeated.img
          rm target/seed/wasm/repeated.img
          mkdir -p seed-images/$EMBEDDED_I18N_LOCALE
          cp target/seed/wasm/seed.img seed-images/$EMBEDDED_I18N_LOCALE/wasm.img
          cargo run -p fs_image -- seed-images/$EMBEDDED_I18N_LOCALE/native.img 16777216 --bundle native --applications-dir target/wasm32-wasip1/release
          cargo run -p fs_image -- target/seed/wasm/native-repeated.img 16777216 --bundle native --applications-dir target/wasm32-wasip1/release
          cmp seed-images/$EMBEDDED_I18N_LOCALE/native.img target/seed/wasm/native-repeated.img
          rm target/seed/wasm/native-repeated.img
          (cd examples/wasm && RUSTUP_TOOLCHAIN="$XILA_NIGHTLY_TOOLCHAIN" trunk build --release --public-url ./)
          mkdir -p pages/demonstrations/wasm/fr/
          cp -r examples/wasm/dist/* pages/demonstrations/wasm/fr/

      - name: Upload reference disk images
        uses: actions/upload-artifact@v4
        with:
          name: reference-filesystem-images
          path: seed-images/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
