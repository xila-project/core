name: Pages

on:
  pull_request:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Core documentation
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      MISE_ENV: ci
      CARGO_TERM_COLOR: always
      XILA_MBX: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: xila-project/workspace/.github/actions/setup-rust@c06ecdc0c3742c65bcfd2f5e7faa9cfcb59a5f6b
        with:
          cache-mode: objects
          cache-generation: v1-pages-all-locales
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run deps:npm
      - name: Build Core documentation
        run: |
          set -eu
          mise run ci:packages-host
          mkdir -p pages/host
          RUSTDOCFLAGS="--deny warnings" mise run docs:host -- --no-deps
          cp -r target/x86_64-unknown-linux-gnu/doc/. pages/host/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
