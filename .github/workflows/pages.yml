name: Pages

on:
  pull_request:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  demo:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
    uses: xila-project/platforms/.github/workflows/demo.yml@0fda35ee9430c931ff16c7da77b41c8d456e4738
    with:
      platform_ref: 0fda35ee9430c931ff16c7da77b41c8d456e4738
  build:
    needs: demo
    name: Build documentation and demonstrations
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      MISE_ENV: ci
      CARGO_TERM_COLOR: always
      XILA_MBX: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: jdx/mise-action@v5.2.2
      - run: mise run deps:npm
      - id: toolchain
        run: mise run ci:toolchain
      - uses: jdx/mr-boxington-action@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          github-cache-mode: objects
          cache-generation: v1-pages-all-locales
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Core documentation
        run: |
          set -eu
          mise run ci:packages-host
          mkdir -p pages/host pages/guest
          RUSTDOCFLAGS="--deny warnings" mise run docs:host -- --no-deps
          RUSTDOCFLAGS="--deny warnings" mise run docs:guest
          cp -r target/x86_64-unknown-linux-gnu/doc/. pages/host/
          cp -r target/wasm32-unknown-unknown/doc/. pages/guest/
      - uses: actions/download-artifact@v7
        with:
          name: platform-demonstrations
          path: pages/demonstrations/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
