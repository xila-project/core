name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_ENV: ci
      XILA_APPLICATIONS_ROOT: ${{ github.workspace }}/.application-src
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Checkout pinned applications"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 3f6c71017a543cfefc19bd54d2d8fdd59ebc8098
          path: .application-src
          persist-credentials: false
      - name: "Setup | Activate mise"
        uses: jdx/mise-action@v5.2.10
      - name: "Setup | Locked npm dependencies"
        run: mise run deps:npm
      - name: "Lint | Rust formatting"
        run: mise run ci:format-rust
      - name: "Lint | TOML formatting"
        run: mise run ci:format-toml
      - name: "Lint | JavaScript and translation assets"
        run: mise run ci:quality-js
      - name: "Test | CI policy regressions"
        run: mise run ci:policy-tests
      - name: "Lint | GitHub Actions"
        run: mise run ci:lint-workflows

  verification:
    name: Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_ENV: ci
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
      - name: "Setup | Activate mise"
        uses: jdx/mise-action@v5.2.10
      - name: "Setup | Native packages"
        timeout-minutes: 15
        run: mise run ci:packages-linker
      - name: "Verify | Subsystem invariants"
        run: mise run ci:verification

  host:
    name: Host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MISE_ENV: ci
      CARGO_TERM_COLOR: always
      # Keep source locations in test backtraces while shrinking build artifacts.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # Keep standalone test crates in the target tree cached by the action.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      XILA_MBX: "1"
      XILA_APPLICATIONS_MANIFEST: ${{ github.workspace }}/.application-src/Cargo.toml
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-src
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Checkout pinned applications"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 3f6c71017a543cfefc19bd54d2d8fdd59ebc8098
          path: .application-src
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@ab0393f7a1df988b8fcd13da38e013057e9c9de8
        with:
          cache-mode: target
          cache-generation: v1-ci-host-line-tables
      - name: "Setup | Locked npm dependencies"
        run: mise run deps:npm
      - name: "Setup | Native packages"
        timeout-minutes: 15
        run: mise run ci:packages-host-sdk
      - name: "Lint | Host workspace"
        run: mise run ci:host-clippy
      - name: "Lint | Host WASM runtime"
        run: mise run ci:host-wasm-clippy
      - name: "Test | Host workspace"
        run: mise run ci:host-tests
      - name: "Test | Native firmware simulator"
        run: mise run ci:firmware
      - name: "Test | Task profiling and metrics"
        run: mise run ci:profiling-task-tests
      - name: "Test | Font linking"
        run: mise run ci:host-font-tests
      - name: "Report | Upload font-link evidence"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: font-pipeline-evidence
          path: target/font-pipeline-evidence/
          if-no-files-found: warn

  bare-metal:
    name: Bare metal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_ENV: ci
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-src
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Checkout pinned applications"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 3f6c71017a543cfefc19bd54d2d8fdd59ebc8098
          path: .application-src
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@ab0393f7a1df988b8fcd13da38e013057e9c9de8
        with:
          cache-mode: objects
          cache-generation: v1-ci-bare-metal
      - name: "Setup | Locked npm dependencies"
        run: mise run deps:npm
      - name: "Setup | Native packages"
        timeout-minutes: 15
        run: mise run ci:packages-host
      - name: "Test | Bare-metal façade"
        run: mise run ci:bare-metal
      - name: "Test | Bare-metal façade without CAS"
        run: mise run ci:bare-metal-no-cas
      - name: "Test | Bare-metal native loader"
        run: mise run ci:native-loader-targets

  xtensa:
    name: Xtensa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISE_ENV: ci
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Activate mise"
        uses: jdx/mise-action@v5.2.10
      - name: "Setup | Xtensa Rust, GCC and libclang"
        run: mise run ci:toolchain-xtensa
      - name: "Setup | Locked npm dependencies"
        run: mise run deps:npm
      - name: "Build | Bare-metal ESP32-S3 LittleFS and graphics, Xtensa stackful"
        run: mise run ci:xtensa

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MISE_ENV: ci
      CARGO_TERM_COLOR: always
      XILA_MBX: "1"
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Checkout pinned applications"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 3f6c71017a543cfefc19bd54d2d8fdd59ebc8098
          path: .application-src
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@ab0393f7a1df988b8fcd13da38e013057e9c9de8
        with:
          cache-mode: target
          cache-generation: v1-ci-wasm
      - name: "Setup | Locked npm dependencies"
        run: mise run deps:npm
      - name: "Setup | Native packages"
        timeout-minutes: 15
        run: mise run ci:packages-linker
      - name: "Lint | WASM guests"
        run: mise run ci:wasm-clippy
      - name: "Test | Browser audio"
        run: mise run ci:wasm-audio-check
      - name: "Test | Browser task yield"
        run: mise run ci:wasm-task-tests

  abi:
    name: ABI (${{ matrix.memory }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        memory: [memory_32, memory_64]
    env:
      MISE_ENV: ci
      CI_ABI_MEMORY: ${{ matrix.memory }}
      XILA_MBX: "1"
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Checkout pinned applications"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 3f6c71017a543cfefc19bd54d2d8fdd59ebc8098
          path: .application-src
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@ab0393f7a1df988b8fcd13da38e013057e9c9de8
        with:
          cache-mode: target
          cache-generation: v1-ci-abi-${{ matrix.memory }}
          working-directory: .application-src/executables/wasm/tests/translation
      - name: "Setup | Native packages"
        timeout-minutes: 15
        run: mise run ci:packages-linker
      - name: "Test | ABI compatibility"
        run: mise run ci:abi

  localization:
    name: Localization
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENV: ci
      CARGO_TERM_COLOR: always
      XILA_MBX: "1"
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-src
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Setup | Checkout pinned applications"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 3f6c71017a543cfefc19bd54d2d8fdd59ebc8098
          path: .application-src
          persist-credentials: false
      - name: "Setup | Select changed locales"
        id: locales
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          locales=()
          if [[ "$EVENT_NAME" != pull_request ]]; then
            locales=(en fr es de pt-BR it pl zh-CN)
          else
            all_locales=false
            declare -A changed=()
            while IFS= read -r path; do
              case "$path" in
                *.rs|*Cargo.toml|*Cargo.lock|mise.toml|mise.*.toml|tools/mise/*|build/*|subsystems/graphics/fonts/*|tolgee.extractor.mjs|tolgee.extractor.test.mjs|*.ftl|*/i18n/*|*/localization/*|executables/wasm/src/host/translation/*|executables/wasm/tests/translation/*)
                  all_locales=true
                  ;;
                *locales/en.json) changed[en]=1 ;;
                *locales/fr.json) changed[fr]=1 ;;
                *locales/es.json) changed[es]=1 ;;
                *locales/de.json) changed[de]=1 ;;
                *locales/pt-BR.json) changed[pt-BR]=1 ;;
                *locales/it.json) changed[it]=1 ;;
                *locales/pl.json) changed[pl]=1 ;;
                *locales/zh-CN.json) changed[zh-CN]=1 ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            if [[ "$all_locales" == true ]]; then
              locales=(en fr es de pt-BR it pl zh-CN)
            elif (( ${#changed[@]} > 0 )); then
              locales=(en)
              for locale in fr es de pt-BR it pl zh-CN; do
                [[ -n "${changed[$locale]:-}" ]] && locales+=("$locale")
              done
            fi
          fi
          if (( ${#locales[@]} > 0 )); then
            printf 'value=%s\n' "${locales[*]}" >> "$GITHUB_OUTPUT"
            echo 'run-check=true' >> "$GITHUB_OUTPUT"
            printf 'Selected locale(s): %s\n' "${locales[*]}"
          else
            echo 'value=' >> "$GITHUB_OUTPUT"
            echo 'run-check=false' >> "$GITHUB_OUTPUT"
            echo 'No localization-relevant files changed; checks are intentionally skipped.'
          fi
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@ab0393f7a1df988b8fcd13da38e013057e9c9de8
        if: steps.locales.outputs.run-check == 'true'
        with:
          cache-mode: objects
          cache-generation: v1-ci-localization
      - name: "Setup | Locked npm dependencies"
        run: mise run deps:npm
        if: steps.locales.outputs.run-check == 'true'
      - name: "Setup | Native packages"
        if: steps.locales.outputs.run-check == 'true'
        timeout-minutes: 15
        run: mise run ci:packages-host
      - name: "Validate | Strict localization catalogs"
        if: steps.locales.outputs.run-check == 'true'
        env:
          CI_LOCALES: ${{ steps.locales.outputs.value }}
          CARGO_TARGET_ROOT: ${{ github.workspace }}/target/localization
        run: mise run ci:localization

  sdk:
    name: SDK (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: ci:packages-sdk
          - target: thumbv7em-none-eabihf
            packages: ci:packages-sdk-arm
          - target: riscv32imac-unknown-none-elf
            packages: ci:packages-sdk-riscv
    env:
      MISE_ENV: ci
      XILA_SDK_TARGET: ${{ matrix.target }}
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Activate mise"
        uses: jdx/mise-action@v5.2.10
      - name: "Setup | SDK build packages"
        # The Arm SDK runs the bounded package helper twice (common, then Arm
        # packages), so leave room for both retry budgets before the job timeout.
        timeout-minutes: 25
        env:
          SDK_PACKAGES: ${{ matrix.packages }}
        run: mise run "$SDK_PACKAGES"
      - name: "Build | SDK archive"
        run: mise run ci:sdk-build
      - name: "Test | SDK ELF checker"
        run: mise run ci:sdk-test
      - name: "Test | SDK example image"
        run: mise run ci:sdk-verify
      - name: "Report | Upload SDK archive"
        uses: actions/upload-artifact@v7
        with:
          name: xila-sdk-${{ matrix.target }}
          path: target/sdk/xila-sdk-*.tar.zst
          if-no-files-found: error

  required:
    name: required
    if: always()
    needs: [quality, verification, host, bare-metal, xtensa, wasm, abi, localization, sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Gate | Verify required validations"
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          HOST_RESULT: ${{ needs.host.result }}
          BARE_METAL_RESULT: ${{ needs.bare-metal.result }}
          XTENSA_RESULT: ${{ needs.xtensa.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
          ABI_RESULT: ${{ needs.abi.result }}
          LOCALIZATION_RESULT: ${{ needs.localization.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
        run: |
          set -euo pipefail
          for result in "$QUALITY_RESULT" "$VERIFICATION_RESULT" "$HOST_RESULT" "$BARE_METAL_RESULT" "$XTENSA_RESULT" "$WASM_RESULT" "$ABI_RESULT" "$LOCALIZATION_RESULT" "$SDK_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "::error::A required validation job finished with result: $result"
              exit 1
            fi
          done
