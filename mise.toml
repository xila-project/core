[vars]
# Version pins only: these declarations never install or activate a tool.
rust_version = "1.97.0"
espup_version = "0.19.0"
esp_gcc_version = "16.1.0_20260609"
nightly_version = "nightly-2026-10-12"
node_version = "24.22.0"
taplo_version = "0.10.0"
uv_version = "0.12.19"
pyyaml_version = "6.0.3"
actionlint_version = "1.7.7"
shellcheck_version = "0.11.0"
trunk_version = "0.21.14"
llvm_cov_version = "0.9.1"
abi_coverage_minimum = "90"
binstall_version = "1.15.7"
nextest_version = "0.9.148"
picolibc_version = "1.8.12"
picolibc_sha256 = "64e8c412e1c40fa6eb1a72d2b5cdbcbfe6ceca4cbea454edbad54557ffc747fa"
meson_version = "1.9.1"
ninja_version = "1.13.0"
# Must match the `wasm-bindgen` crate version in Cargo.lock.
wasm_bindgen_version = "0.2.129"

[tasks."deps:npm"]
description = "Install locked npm dependencies"
run = "npm ci"

[tasks."check:host"]
description = "Check the Linux host target"
run = "cargo check --target x86_64-unknown-linux-gnu --features graphics,graphics_rendering_xrgb8888"

[tasks."check:guest"]
description = "Check the WASM guest target"
run = "cargo check --manifest-path \"${XILA_APPLICATIONS_ROOT:-.application-src}/Cargo.toml\" --target wasm32-unknown-unknown --package xila-wasm --no-default-features --features default_guest"

[tasks."localization:host-check"]
description = "Strictly check host localization"
run = "cargo check --workspace --all-targets --target x86_64-unknown-linux-gnu --features xila/graphics,xila/graphics_rendering_xrgb8888"

[tasks."localization:guest-check"]
description = "Strictly check Wasm guest API localization"
run = "cargo check --manifest-path \"${XILA_APPLICATIONS_ROOT:-.application-src}/Cargo.toml\" --target wasm32-unknown-unknown --package xila-wasm --no-default-features --features default_guest"

[tasks."localization:lint"]
description = "Check semantic translation keys, catalogs and Rust macro references"
run = "node tools/localization/check.mjs"

[tasks."localization:check"]
description = "Run strict host and guest localization checks"
depends = ["localization:host-check", "localization:guest-check"]

[tasks."clippy:host"]
description = "Run Clippy for the Linux host target"
run = "cargo clippy --workspace --target x86_64-unknown-linux-gnu --features xila/graphics,xila/graphics_rendering_xrgb8888 --all-targets -- -D warnings"

[tasks."clippy:guest"]
description = "Run Clippy for the WASM guest target"
run = "cargo clippy --manifest-path \"${XILA_APPLICATIONS_ROOT:-.application-src}/Cargo.toml\" --package xila-wasm --no-default-features --features default_guest --target wasm32-unknown-unknown --all-targets -- -D warnings"

[tasks."clippy:all"]
description = "Run host and guest Clippy"
depends = ["clippy:host", "clippy:guest"]

[tasks."docs:host"]
description = "Build host documentation"
run = "cargo doc --workspace --features xila/graphics,xila/graphics_rendering_xrgb8888,xila/audio,xila/neural_network,xila/bootsplash,xila-testing/graphics --target x86_64-unknown-linux-gnu"

[tasks."docs:guest"]
description = "Build guest documentation"
run = "cargo doc --manifest-path \"${XILA_APPLICATIONS_ROOT:-.application-src}/Cargo.toml\" --package xila-wasm --no-default-features --features default_guest --target wasm32-wasip1"

[tasks."docs:all"]
description = "Build host and guest documentation"
depends = ["docs:host", "docs:guest"]

[tasks."check:all"]
description = "Check host and guest targets"
depends = ["check:host", "check:guest"]

[tasks."test:browser-task"]
description = "Run the browser task tests (yield and timers) in headless Chrome"
env.CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER = "wasm-bindgen-test-runner"
# GitHub-hosted runners ship Chrome and a matching chromedriver in $CHROMEWEBDRIVER. Elsewhere, put a chromedriver that matches your Chrome on PATH or set CHROMEDRIVER.
run = """
set -eu
if [ -z "${CHROMEDRIVER:-}" ] && [ -n "${CHROMEWEBDRIVER:-}" ]; then
  export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
fi
# Each file is its own page: the no-`MessageChannel` scenarios must start clean. The
# library's unit tests are host tests (plain `#[test]`) and do not run here.
cargo test --locked -p xila-task --target wasm32-unknown-unknown \
  --test browser_yield \
  --test browser_yield_without_message_channel \
  --test browser_yield_without_timers
"""

[tasks."test:workspace"]
description = "Test the Cargo workspace"
run = "cargo test --workspace"

[tasks."test:graphics-pool"]
description = "Test graphics against LVGL's fixed memory pool instead of the system allocator"
# The pool is forced on for the host and enlarged to fit the full-screen capture test; it needs its own target directory because it changes the LVGL build.
run = "LVGL_CFLAGS=XILA_LVGL_MEM_POOL=1,XILA_LVGL_MEM_SIZE=4194304 CARGO_TARGET_DIR=\"${CARGO_TARGET_DIR:-target}/lvgl-pool\" cargo test --locked -p xila-graphics --features rendering_xrgb8888"

[tasks."test:fonts"]
description = "Test font caching, compile-time selection, and linked archive exclusion"
run = """
set -eu
cargo test --manifest-path subsystems/graphics/tests/font_pipeline/Cargo.toml
cargo clippy --manifest-path subsystems/graphics/tests/font_pipeline/Cargo.toml --all-targets -- -D warnings
cargo clippy --manifest-path subsystems/graphics/tests/font_link/Cargo.toml --all-targets -- -D warnings
python3 -m unittest discover -s subsystems/graphics/tests/font_pipeline -p 'test_*.py' -v
python3 subsystems/graphics/tests/font_pipeline/verify.py --target "${CARGO_TARGET_DIR:-target/font-pipeline}" --report target/font-pipeline-evidence
"""

[tasks."build:cargo"]
description = "Build Cargo packages"
run = "cargo build"

[tasks."firmware:test"]
description = "Test bounded firmware transactions"
run = "cargo test --locked -p xila-firmware-update"

[tasks."firmware:integration"]
description = "Test firmware VFS permissions"
run = "cargo test --locked -p xila-firmware-update --features native"

[tasks."sdk:build"]
description = "Build the native SDK archive (XILA_SDK_TARGET, default x86_64-unknown-linux-gnu) under target/sdk"
tools.uv = "{{ vars.uv_version }}"
run = "uv run --no-project --with meson=={{ vars.meson_version }} --with ninja=={{ vars.ninja_version }} python tools/sdk/build.py build --target \"${XILA_SDK_TARGET:-x86_64-unknown-linux-gnu}\""

[tasks."sdk:verify"]
description = "Verify the packaged Rust crate, build the C examples, check the ELF contract and report sizes"
tools.uv = "{{ vars.uv_version }}"
run = "uv run --no-project --with meson=={{ vars.meson_version }} --with ninja=={{ vars.ninja_version }} python tools/sdk/build.py verify --target \"${XILA_SDK_TARGET:-x86_64-unknown-linux-gnu}\""

[tasks."sdk:test"]
description = "Test the SDK's ELF checker"
tools.uv = "{{ vars.uv_version }}"
run = "uv run --no-project python -m unittest discover -s tools/sdk -v"

[tasks."sdk:rust-example"]
description = "Build and verify Rust native ELFs (all targets or XILA_SDK_TARGET), running the Linux image through execute"
tools.uv = "{{ vars.uv_version }}"
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal" }
run = """
set -eu
rustup toolchain install {{ vars.nightly_version }} --profile minimal --component rust-src
uv run --no-project python tools/sdk/build.py rust-example ${XILA_SDK_TARGET:+--target="$XILA_SDK_TARGET"}
case "${XILA_SDK_TARGET:-x86_64-unknown-linux-gnu}" in
  x86_64-unknown-linux-gnu)
    rustup run {{ vars.nightly_version }} cargo test --locked \
      --manifest-path libraries/abi/application/sdk/rust/xila-sys/Cargo.toml --features runtime
    XILA_RUST_HELLO="$PWD/target/sdk/rust-hello/x86_64-unknown-linux-gnu/release/xila-rust-hello" \
      cargo test --locked -p xila-executable --features native-dev --test sdk -- runs_sdk_rust_hello --ignored --exact
    ;;
esac
"""

[tasks."test:native-loader"]
description = "Test ELF validation, executable dispatch, native C startup and the SDK's C library on Linux x86-64"
depends = ["sdk:build"]
run = """
set -eu
cargo test --locked -p xila-executable --features native-dev
"""
