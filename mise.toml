[vars]
# Version pins only: these declarations never install or activate a tool.
rust_version = "1.99.0"
nightly_version = "nightly-2026-10-12"
node_version = "24.22.0"
taplo_version = "0.10.0"
actionlint_version = "1.7.7"
shellcheck_version = "0.11.0"
trunk_version = "0.21.14"
llvm_cov_version = "0.6.21"
binstall_version = "1.15.7"
nextest_version = "0.9.148"

[tasks."deps:npm"]
description = "Install locked npm dependencies"
run = "npm ci"

[tasks."check:host"]
description = "Check the Linux host target"
run = "cargo check --target x86_64-unknown-linux-gnu --features graphics,abi_definitions,graphics_rendering_xrgb8888"

[tasks."check:guest"]
description = "Check the WASM guest target"
run = "cargo check --target wasm32-unknown-unknown --package wasm --no-default-features --features default_guest"

[tasks."localization:host-check"]
description = "Strictly check host localization"
env = { EMBEDDED_I18N_STRICT = "1" }
run = "cargo check --workspace --all-targets --target x86_64-unknown-linux-gnu --features xila/graphics,xila/abi_definitions,xila/graphics_rendering_xrgb8888"

[tasks."localization:guest-check"]
description = "Strictly check WASI application localization"
env = { EMBEDDED_I18N_STRICT = "1" }
run = "cargo check --target wasm32-wasip1 --package calculator --package weather --package clock --package pixel_painter --package text_editor --package synth"

[tasks."localization:lint"]
description = "Check semantic translation keys, catalogs and Rust macro references"
run = "node tools/localization/check.mjs"

[tasks."localization:check"]
description = "Run strict host and guest localization checks"
depends = ["localization:host-check", "localization:guest-check"]

[tasks."clippy:host"]
description = "Run Clippy for the Linux host target"
run = "cargo clippy --package xila --package audio --package drivers_headless --target x86_64-unknown-linux-gnu --features xila/graphics,xila/abi_definitions,xila/graphics_rendering_xrgb8888 --all-targets -- -D warnings"

[tasks."clippy:guest"]
description = "Run Clippy for the WASM guest target"
run = "cargo clippy --package wasm --no-default-features --features default_guest --target wasm32-unknown-unknown --all-targets -- -D warnings"

[tasks."clippy:all"]
description = "Run host and guest Clippy"
depends = ["clippy:host", "clippy:guest"]

[tasks."docs:host"]
description = "Build host documentation"
run = "cargo doc --features graphics,abi_definitions,graphics_rendering_xrgb8888 --target x86_64-unknown-linux-gnu"

[tasks."docs:guest"]
description = "Build guest documentation"
run = "cargo doc --package wasm --no-default-features --features default_guest --target wasm32-unknown-unknown"

[tasks."docs:all"]
description = "Build host and guest documentation"
depends = ["docs:host", "docs:guest"]

[tasks."check:all"]
description = "Check host and guest targets"
depends = ["check:host", "check:guest"]

[tasks."test:workspace"]
description = "Test the Cargo workspace"
run = "cargo test --workspace"

[tasks."test:fonts"]
description = "Test font caching, compile-time selection, and linked archive exclusion"
run = """
set -eu
cargo test --manifest-path subsystems/graphics/tests/font_pipeline/Cargo.toml
cargo clippy --manifest-path subsystems/graphics/tests/font_pipeline/Cargo.toml --all-targets -- -D warnings
cargo clippy --manifest-path subsystems/graphics/tests/font_link/Cargo.toml --all-targets -- -D warnings
python3 -m unittest discover -s subsystems/graphics/tests/font_pipeline -p 'test_*.py' -v
python3 subsystems/graphics/tests/font_pipeline/verify.py --target "${CARGO_TARGET_DIR:-target/font-pipeline}" --report target/font-pipeline-evidence
"""

[tasks."build:cargo"]
description = "Build Cargo packages"
run = "cargo build"

[tasks."build:profiling"]
description = "Build the native profiling binary"
run = "cargo build --package native_example --profile profiling"

[tasks."build:applications"]
description = "Build WASI applications for profiling images"
run = "cargo build --locked --package calculator --package weather --package clock --package pixel_painter --package text_editor --package synth --target wasm32-wasip1 --profile release-wasm"

[tasks."image:native"]
description = "Build the native filesystem seed image"
depends = ["build:applications"]
run = """
set -eu
mkdir -p target/seed/native
rm -f target/seed/native/seed.img
cargo run --locked --package fs_image -- target/seed/native/seed.img 16777216 --bundle native --applications-dir target/wasm32-wasip1/release-wasm
"""

[tasks."image:wasm"]
description = "Build the WASM filesystem seed image"
run = """
set -eu
cargo build --locked --package calculator --package weather --package clock --package pixel_painter --package text_editor --package synth --target wasm32-wasip1 --release
mkdir -p "${CARGO_TARGET_DIR:-target}/seed/wasm"
rm -f "${CARGO_TARGET_DIR:-target}/seed/wasm/seed.img"
cargo run --locked --package fs_image -- "${CARGO_TARGET_DIR:-target}/seed/wasm/seed.img" 16777216 --bundle wasm --applications-dir "${CARGO_TARGET_DIR:-target}/wasm32-wasip1/release"
"""
