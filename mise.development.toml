[tools]
rust = { version = "1.99.0", profile = "minimal", components = [
  "clippy",
  "rustfmt",
  "llvm-tools-preview",
], targets = [
  "wasm32-unknown-unknown",
  "wasm32-wasip1",
] }
node = "24.22.0"
taplo = "0.10.0"
"aqua:rhysd/actionlint" = "1.7.7"
"cargo:trunk" = "0.21.14"
"aqua:taiki-e/cargo-llvm-cov" = "0.6.21"
"aqua:cargo-bins/cargo-binstall" = "1.15.7"

[bootstrap.packages]
"apt:clang" = "latest"
"apt:mold" = "latest"
"apt:pkg-config" = "latest"
"apt:libasound2-dev" = "latest"
"apt:libudev-dev" = "latest"
"apt:libxkbcommon-dev" = "latest"
"apt:libwayland-dev" = "latest"
"apt:libx11-dev" = "latest"
"apt:libxkbcommon-x11-dev" = "latest"
