[package]
name = "native_example"
version = "0.1.0"
edition = "2024"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
xila = { path = "../../", features = [
  "graphics",
  "graphics_rendering_xrgb8888",
  "bootsplash",
] }
abi_definitions = { workspace = true }
file_manager = { workspace = true }
command_line_shell = { workspace = true }
graphical_shell = { workspace = true }
wasm = { workspace = true, features = ["host", "graphics"] }
terminal = { workspace = true }
settings = { workspace = true }
debug_application = { workspace = true }
drivers_core = { workspace = true }
drivers_std = { workspace = true }
drivers_shared = { workspace = true }
drivers_native = { workspace = true }
audio = { workspace = true, optional = true }
getargs = { version = "0.5" }
getargs-derive = { workspace = true }

[features]
default = []
audio = ["dep:audio", "drivers_native/audio"]
# Compatibility flag: bundled applications now always come from the seed.
prebuilt-applications = []
profiling = ["drivers_std/profiling", "prebuilt-applications"]
heaptrack = ["drivers_std/heaptrack", "prebuilt-applications"]
