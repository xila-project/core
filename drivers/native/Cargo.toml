[package]
name = "xila-drivers-native"
version = "0.1.0"
edition = "2024"

[lib]
name = "drivers_native"

[features]
default = []
audio = ["dep:audio", "dep:nanoaudio", "dep:nanoaudio-cpal"]

[[example]]
name = "audio"
required-features = ["audio"]

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
file_system = { workspace = true }
network = { workspace = true }
embassy-futures = { workspace = true }
audio = { workspace = true, optional = true }
nanoaudio = { workspace = true, optional = true }
nanoaudio-cpal = { workspace = true, optional = true }

graphics = { workspace = true, features = ["rendering_xrgb8888"] }
task = { workspace = true }
log = { workspace = true }
synchronization = { workspace = true }
shared = { workspace = true }

critical-section = { workspace = true, features = ["std"] }
pixels = "0.17.1"
winit = { version = "0.30", features = ["rwh_05"] }
rand = "0.10.0"
libc = { version = "0.2" }
png = "0.18.1"
serde_json = "1.0"
debug_protocol = { workspace = true }
cap-std = "4.0.3"
users = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

embassy-executor = { workspace = true, default-features = false, features = [
  "platform-std",
  "executor-thread",
] }
arboard = { version = "3.6", features = ["wayland-data-control"] }

[dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
testing = { workspace = true }
abi_definitions = { workspace = true }
drivers_std = { workspace = true }
drivers_shared = { workspace = true }
virtual_file_system = { workspace = true }
