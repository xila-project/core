[package]
name = "xila-drivers-peripherals"
version.workspace = true
edition = "2024"

[dependencies]
device = { workspace = true }
embedded-io = { workspace = true, optional = true }
embedded-hal = { workspace = true, optional = true }
file_system = { workspace = true }
peripherals = { workspace = true, optional = true }
shared = { workspace = true }
synchronization = { workspace = true }
task = { workspace = true, optional = true }
virtual_file_system = { workspace = true, optional = true }

[dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
virtual_file_system = { workspace = true }
testing = { workspace = true }
embedded-hal = { workspace = true }
peripherals = { workspace = true, features = ["mock"] }
little_fs = { workspace = true }
time = { workspace = true }
users = { workspace = true }
log = { workspace = true }
critical-section = { workspace = true, features = ["std"] }
abi_definitions = { workspace = true }

[features]
default = ["vfs"]
# Mount helper for the virtual file system.
vfs = ["dep:task", "dep:virtual_file_system"]
# UART device node adapter. `mount_uart` is available with the `vfs` feature.
uart = ["dep:peripherals", "dep:embedded-io", "peripherals/uart"]
# I2C device nodes over `peripherals::i2c`.
i2c = ["dep:embedded-hal", "dep:peripherals", "peripherals/i2c"]
# GPIO line nodes over `peripherals::gpio` (adapter, control commands, mount helper).
gpio = ["dep:embedded-hal", "dep:peripherals", "peripherals/gpio"]
# ADC device node over `peripherals::adc` (adapter, control commands, mount helper).
adc = ["dep:peripherals", "peripherals/adc"]
# SPI device node over `peripherals::spi` (adapter, control commands, mount helper).
spi = ["dep:embedded-hal", "dep:peripherals", "peripherals/spi"]
# PWM device node over `peripherals::pwm` (adapter, control commands, mount helper).
pwm = ["dep:embedded-hal", "dep:peripherals", "peripherals/pwm"]

[lib]
name = "drivers_peripherals"
