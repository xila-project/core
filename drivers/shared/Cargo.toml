[package]
name = "xila-drivers-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
file_system = { workspace = true }
log = { workspace = true }
shared = { workspace = true }
device = { workspace = true }
network = { workspace = true }
task = { workspace = true }
synchronization = { workspace = true }
embassy-futures = { workspace = true }
embedded-io-async = { workspace = true }
embedded-tls = { workspace = true }
embedded-io = { workspace = true }
rand_core = { version = "0.10", default-features = false }
# embedded-tls 0.19 still requires the rand_core 0.6 traits.
rand_core_06 = { package = "rand_core", version = "0.6", default-features = false }

getrandom = { version = "0.4.2" }
sha2 = { version = "0.11" }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }
