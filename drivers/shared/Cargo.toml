[package]
name = "xila-drivers-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
xila_http = { workspace = true }
file_system = { workspace = true }
log = { workspace = true }
shared = { workspace = true }
device = { workspace = true }
network = { workspace = true }
task = { workspace = true }
synchronization = { workspace = true }
embassy-futures = { workspace = true }
embedded-io-async = { workspace = true }
embedded-tls = { workspace = true }
embedded-io = { workspace = true }
rand_core = { version = "0.10", default-features = false }
# embedded-tls 0.19 still requires the rand_core 0.6 traits.
rand_core_06 = { package = "rand_core", version = "0.6", default-features = false }

getrandom = { version = "0.4.2" }
sha2 = { version = "0.11" }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
embassy-executor = { workspace = true, features = [
  "platform-std",
  "executor-thread",
] }
embassy-time = { workspace = true, features = ["generic-queue-8"] }

[lib]
name = "drivers_shared"
