[package]
name = "drivers_wasm"
version = "0.1.0"
edition = "2024"

[features]
default = []
audio = ["dep:audio", "dep:nanoaudio-web"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
file_system = { workspace = true }
audio = { workspace = true, optional = true }
nanoaudio-web = { workspace = true, optional = true }
memory = { workspace = true }
graphics = { workspace = true, features = ["rendering_xrgb8888"] }
critical-section = { workspace = true, features = ["std"] }
task = { workspace = true }
synchronization = { workspace = true }
log = { workspace = true }
shared = { workspace = true }

linked_list_allocator = { workspace = true }
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
embassy-executor = { workspace = true, default-features = false, features = [
  "platform-wasm",
  "executor-thread",
] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3.64", features = [
  "Window",
  "Document",
  "DomException",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "MouseEvent",
  "KeyboardEvent",
  "TouchEvent",
  "Touch",
  "TouchList",
  "EventTarget",
  "ImageData",
  "Element",
  "HtmlElement",
  "DomRect",
  "console",
  # OPFS features
  "StorageManager",
  "StorageEstimate",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemHandle",
  "FileSystemWritableFileStream",
  "WritableStream",
  "ReadableStream",
  "File",
  "Blob",
  "Navigator",
  "FileSystemGetFileOptions",
  "FileSystemCreateWritableOptions",
  "FileSystemSyncAccessHandle",
  "FileSystemReadWriteOptions",
  "WebGl2RenderingContext",
  "Request",
  "Response",
  "RequestInit",
  "Headers",
  "Url",
  "UrlSearchParams",
  "ClipboardEvent",
  "DataTransfer",
  "ResizeObserver",
  "ResizeObserverEntry",
] }
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
little_fs = { workspace = true }
abi_definitions = { workspace = true }
xila = { path = "../.." }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.web-sys]
version = "0.3.64"
features = ["KeyboardEventInit", "ClipboardEventInit"]
