[package]
name = "xila-time"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
embassy-time = { workspace = true }
file_system = { workspace = true }
log = { workspace = true }
shared = { workspace = true }
synchronization = { workspace = true }
embedded-i18n = { workspace = true }

[dev-dependencies]
testing_support = { workspace = true }
task = { workspace = true, features = ["test_harness"] }
log = { workspace = true }

[[test]]
name = "integration"
path = "Tests/integration.rs"

[lib]
name = "time"

[[test]]
name = "realtime"
path = "Tests/realtime.rs"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
