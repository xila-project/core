[package]
name = "xila-graphics-bindgen"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "visit", "extra-traits"] }

[dev-dependencies]
cbindgen = { workspace = true }
prettyplease = { workspace = true }
syn2 = { workspace = true, features = ["full"] }
# Tests derive the catalog from the host bindings. The library takes the
# bindings source as an argument, so no build script runs LVGL's bindgen for it.
lvgl_rust_sys = { workspace = true }

[lib]
name = "graphics_bindgen"
