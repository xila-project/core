[package]
name = "xila-graphics"
version.workspace = true
edition = "2024"

[dependencies]
cstr_core = "0.2.6"
device = { workspace = true }
file_system = { workspace = true }
virtual_file_system = { workspace = true }
# Runtime graphics needs the C archive; binding generators remain bindgen-only.
lvgl_rust_sys = { workspace = true, features = ["build-lvgl", "shadcn-theme"] }
# The safe layer and its handle registry. Registry chunks come from the global
# allocator (never LVGL's pool); owner tags let the Wasm host keep each VM's
# handles apart. Core provides LVGL's string functions itself.
lvgl-rust = { workspace = true, features = ["growable-registry", "owners"] }
time = { workspace = true }
shared = { workspace = true }
synchronization = { workspace = true }
log = { workspace = true }
abi_declarations = { workspace = true }
memory = { workspace = true }
embedded-i18n = { workspace = true }
task = { workspace = true }

[dev-dependencies]
# Tests render in XRGB8888; production builds still select a format explicitly.
graphics = { workspace = true, features = ["rendering_xrgb8888"] }
testing = { workspace = true }
little_fs = { workspace = true }
task = { workspace = true, features = ["test_harness"] }
drivers_core = { workspace = true }
users = { workspace = true }

abi_definitions = { workspace = true }

[build-dependencies]
toml = "1"
cc = "1"
embedded-i18n = { workspace = true, features = ["std"] }
serde_json = "1"
sha2 = "0.11"

[features]
default = []
rendering_rgb565 = ["lvgl_rust_sys/color_depth_16"]
rendering_xrgb8888 = ["lvgl_rust_sys/color_depth_32"]

[lib]
name = "graphics"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
