[package]
name = "xila-virtual-file-system"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
file_system = { workspace = true }
task = { workspace = true }
users = { workspace = true }
time = { workspace = true }
synchronization = { workspace = true }
shared = { workspace = true }
log = { workspace = true }
portable-atomic = { workspace = true }
embedded-i18n = { workspace = true }

embedded-io-async = { workspace = true }

[target.'cfg(any(all(any(target_arch = "x86_64", target_arch = "aarch64"), target_os = "linux"), all(any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "arm", target_arch = "riscv32"), target_os = "none")))'.dependencies]
stackful = { workspace = true }

[dev-dependencies]
testing_support = { workspace = true }
drivers_core = { workspace = true }
executable = { workspace = true }
little_fs = { workspace = true }
memory_file_system = { workspace = true }
task = { workspace = true, features = ["test_harness"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lib]
name = "virtual_file_system"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
