[package]
name = "xila-network"
version.workspace = true
edition = "2024"

[dependencies]
bitflags = { version = "2", default-features = false }
device = { workspace = true }
file_system = { workspace = true }
synchronization = { workspace = true }
time = { workspace = true }
task = { workspace = true }
users = { workspace = true }
log = { workspace = true }
virtual_file_system = { workspace = true }
shared = { workspace = true }
embedded-i18n = { workspace = true }

embedded-io-async = { workspace = true }
embassy-time = { workspace = true }
embassy-futures = { workspace = true }
smol_str = { workspace = true }
smoltcp = { workspace = true, features = [
  "async",
  "alloc",
  "log",
  "medium-ethernet",
  "medium-ip",
  "packetmeta-id",
  "proto-ipv4",
  "proto-ipv6",
  "socket-raw",
  "socket-udp",
  "socket-tcp",
  "socket-dns",
  "socket-icmp",
  "socket-dhcpv4",
] }
heapless = { version = "0.9" }

[dev-dependencies]
testing = { workspace = true }
task = { workspace = true, features = ["test_harness"] }
little_fs = { workspace = true }
abi_definitions = { workspace = true }

[lib]
name = "network"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
