[package]
name = "xila-task"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
task_macros = { package = "xila-task-macros", path = "./task_macros" }
users = { workspace = true }
embassy-executor = { workspace = true, default-features = false }
embassy-futures = { workspace = true }
portable-atomic = { workspace = true }
synchronization = { workspace = true }
embedded-i18n = { workspace = true }
# std critical sections for test binaries (`test_harness`).
critical-section = { workspace = true, optional = true, features = ["std"] }


[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
embassy-time = { workspace = true, features = ["std"] }

[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "wasi", target_arch = "wasm32")))'.dependencies]
# Bare-metal targets: the platform supplies the embassy-time driver.
embassy-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
embassy-time = { workspace = true, features = ["wasm"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# `yield_now` is a macrotask (`MessageChannel`); the driver feature above already
# links all three crates through `embassy-time/wasm`.
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_os = "wasi")'.dependencies]
embassy-executor = { workspace = true, default-features = false, features = [
  "platform-spin",
  "executor-thread",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
std = []
# Test executor for `#[task::test]` (std; Embassy provides its std pender).
test_harness = [
  "std",
  "dep:critical-section",
  "embassy-executor/platform-std",
  "embassy-executor/executor-thread",
]
profiling = ["dep:libc"]
# Portable per-task and per-executor CPU activity counters (`task::metrics`).
metrics = []

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
embassy-executor = { workspace = true, default-features = false, features = [
  "platform-std",
  "executor-thread",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
embassy-executor = { workspace = true, default-features = false, features = [
  "platform-wasm",
  "executor-thread",
] }

[lib]
name = "task"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
