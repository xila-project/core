[package]
name = "xila-task"
version.workspace = true
edition = "2024"

[dependencies]
task_macros = { package = "xila-task-macros", path = "./task_macros" }
users = { workspace = true }
embassy-executor = { workspace = true, default-features = false }
embassy-futures = { workspace = true }
smol_str = { workspace = true }
synchronization = { workspace = true }
embedded-i18n = { workspace = true }
# std critical sections for test binaries (`test_harness`).
critical-section = { workspace = true, optional = true, features = ["std"] }


[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
embassy-time = { workspace = true, features = ["std"] }

[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "wasi", target_arch = "wasm32")))'.dependencies]
# Bare-metal targets: the platform supplies the embassy-time driver.
embassy-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
embassy-time = { workspace = true, features = ["wasm"] }

[target.'cfg(target_os = "wasi")'.dependencies]
embassy-executor = { workspace = true, default-features = false, features = [
  "platform-spin",
  "executor-thread",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
std = []
# Test executor for `#[task::test]` (std; Embassy provides its std pender).
test_harness = [
  "std",
  "embassy-executor/platform-std",
  "embassy-executor/executor-thread",
]
profiling = ["dep:libc"]

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }
embassy-executor = { workspace = true, default-features = false, features = [
  "platform-std",
  "executor-thread",
] }

[lib]
name = "task"
