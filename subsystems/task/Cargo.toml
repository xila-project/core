[package]
name = "xila-task"
version = "0.1.0"
edition = "2024"

[dependencies]
task_macros = { package = "xila-task-macros", path = "./task_macros" }
users = { workspace = true }
embassy-executor = { workspace = true, default-features = false }
embassy-futures = { workspace = true }
smol_str = { workspace = true }
synchronization = { workspace = true }
embedded-i18n = { workspace = true }


[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
embassy-time = { workspace = true, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
embassy-time = { workspace = true, features = ["wasm"] }

[target.'cfg(target_os = "wasi")'.dependencies]
embassy-executor = { workspace = true, default-features = false, features = [
  "platform-spin",
  "executor-thread",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
std = []
test_harness = ["std"]
profiling = ["dep:libc"]

[dev-dependencies]
drivers_native = { workspace = true }
drivers_core = { workspace = true }
drivers_shared = { workspace = true }
drivers_std = { workspace = true }
