[package]
name = "verification"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Allocation-free SHA-256 and strict Ed25519 verification primitives"

[features]
default = ["sha256"]
sha256 = ["dep:sha2", "dep:subtle"]
ed25519 = ["dep:ed25519-dalek"]

[dependencies]
sha2 = { version = "0.11", default-features = false, optional = true }
subtle = { version = "2.6", default-features = false, optional = true }
ed25519-dalek = { version = "3.0", default-features = false, optional = true }
