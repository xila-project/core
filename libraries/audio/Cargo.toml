[package]
name = "xila-audio"
version.workspace = true
edition = "2024"

[dependencies]
device = { workspace = true }
file_system = { workspace = true }
shared = { workspace = true }
synchronization = { workspace = true }
nanoaudio = { workspace = true, features = ["buffer", "dsp"] }

# Native 8-bit and pointer atomics are used directly where available.
[target.'cfg(not(all(target_has_atomic = "8", target_has_atomic = "ptr")))'.dependencies]
portable-atomic = { workspace = true }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[lib]
name = "audio"
