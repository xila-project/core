[package]
name = "xila-peripherals"
version.workspace = true
edition = "2024"

[dependencies]
embedded-hal = { workspace = true, optional = true }
embedded-hal-async = { workspace = true, optional = true }
embedded-io = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
synchronization = { workspace = true, optional = true }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[features]
default = []
# Xila-owned one-shot ADC contract.
adc = []
gpio = ["dep:embedded-hal"]
i2c = ["dep:embedded-hal", "dep:embedded-hal-async"]
spi = ["dep:embedded-hal", "dep:embedded-hal-async"]
power = []
pwm = ["dep:embedded-hal"]
uart = ["dep:embedded-io", "dep:embedded-io-async"]
mock = [
  "adc",
  "gpio",
  "i2c",
  "power",
  "pwm",
  "spi",
  "uart",
  "dep:synchronization",
]

[lib]
name = "peripherals"
