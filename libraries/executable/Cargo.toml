[package]
name = "xila-executable"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
device = { workspace = true }
file_system = { workspace = true }
lifecycle = { workspace = true }
virtual_file_system = { workspace = true }
task = { workspace = true }
users = { workspace = true }
shared = { workspace = true }
log = { workspace = true }
embedded-i18n = { workspace = true }
# Only the linked-program support uses it (the ExclusiveSlot flag); the test targets get
# their own copy from [dev-dependencies].
portable-atomic = { workspace = true, optional = true }
graphics = { workspace = true, optional = true }
network = { workspace = true, optional = true }
time = { workspace = true }
synchronization = { workspace = true }
native_loader = { workspace = true, optional = true }

[target.'cfg(any(all(any(target_arch = "x86_64", target_arch = "aarch64"), target_os = "linux"), all(any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "arm", target_arch = "riscv32", target_arch = "xtensa"), target_os = "none")))'.dependencies]
abi_application = { workspace = true, optional = true }
stackful = { workspace = true, optional = true }

[dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
drivers_core = { workspace = true }
# xila-executable is in the dependency tree of the testing environment, so it
# must use the support crate: see xila-testing.
testing_support = { workspace = true }
virtual_file_system = { workspace = true, features = ["test_harness"] }

[features]
default = []
building = []
native-dev = ["dep:abi_application", "dep:native_loader", "dep:stackful"]
native-linked = ["dep:abi_application", "dep:stackful", "dep:portable-atomic"]
graphics = ["dep:graphics", "abi_application?/graphics"]
network = ["dep:network", "abi_application?/network"]

[lib]
name = "executable"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
libc = "0.2"
little_fs.workspace = true
portable-atomic.workspace = true
xila-sys = { path = "../abi/application/sdk/rust/xila-sys", features = [
  "linked",
] }
# The graphics test renders in XRGB8888, as the graphics crate's own tests do.
graphics = { workspace = true, features = ["rendering_xrgb8888"] }
