[package]
name = "xila-executable"
version.workspace = true
edition = "2024"

[dependencies]
file_system = { workspace = true }
virtual_file_system = { workspace = true }
task = { workspace = true }
users = { workspace = true }
shared = { workspace = true }
log = { workspace = true }
embedded-i18n = { workspace = true }
graphics = { workspace = true, optional = true }
network = { workspace = true }
time = { workspace = true }
synchronization = { workspace = true }

[dev-dependencies]
testing = { workspace = true }
task = { workspace = true, features = ["test_harness"] }
drivers_core = { workspace = true }

[features]
default = []
building = []
graphics = ["dep:graphics"]

[lib]
name = "executable"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
fallback = ["en"]
strict = true
