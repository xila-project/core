[package]
name = "xila-abi-application-c-tests"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
abi_application = { workspace = true, features = ["network"] }
network.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
testing.workspace = true
task = { workspace = true, features = ["test_harness"] }
file_system.workspace = true
virtual_file_system.workspace = true
little_fs.workspace = true
time.workspace = true
users.workspace = true
portable-atomic.workspace = true
shared.workspace = true

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dev-dependencies]
stackful = { workspace = true }
