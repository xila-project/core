[package]
name = "xila-abi-application"
version.workspace = true
edition = "2024"
links = "xila_abi_application"

[lib]
name = "abi_application"

[features]
default = []
network = ["dep:network", "dep:smoltcp", "dep:embassy-futures"]

[dependencies]
network = { workspace = true, optional = true }
smoltcp = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
virtual_file_system.workspace = true
file_system.workspace = true
task.workspace = true
time.workspace = true
synchronization.workspace = true

[build-dependencies]
cbindgen.workspace = true

[dev-dependencies]
testing.workspace = true
task = { workspace = true, features = ["test_harness"] }
