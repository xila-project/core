[package]
name = "xila-abi-application"
version.workspace = true
edition = "2024"
rust-version.workspace = true
links = "xila_abi_application"

[lib]
name = "abi_application"

[features]
default = []
network = ["dep:network", "dep:smoltcp", "dep:embassy-futures"]
graphics = ["dep:graphics"]

[dependencies]
network = { workspace = true, optional = true }
graphics = { workspace = true, optional = true }
smoltcp = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
virtual_file_system.workspace = true
file_system.workspace = true
task.workspace = true
time.workspace = true
synchronization.workspace = true
embassy-time.workspace = true
xila_version.workspace = true

[target.'cfg(any(all(any(target_arch = "x86_64", target_arch = "aarch64"), target_os = "linux"), all(any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "arm", target_arch = "riscv32", target_arch = "xtensa"), target_os = "none")))'.dependencies]
stackful = { workspace = true }

[build-dependencies]
xila_version.workspace = true
io_error.workspace = true
cbindgen.workspace = true
syn = { workspace = true, features = ["full"] }
quote.workspace = true
prettyplease = { workspace = true }
syn2 = { workspace = true, features = ["full"] }

[dev-dependencies]
testing.workspace = true
task = { workspace = true, features = ["test_harness"] }
users.workspace = true
memory_file_system.workspace = true
