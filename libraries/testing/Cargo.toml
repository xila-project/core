[package]
name = "xila-testing"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Minimal std test support for Xila: test devices, allocator and environment setup, without platform drivers"

[dependencies]
testing_support = { workspace = true }
# `environment`: initialize() and load_file().
abi_definitions = { workspace = true, optional = true }
authentication = { workspace = true, optional = true }
drivers_core = { workspace = true, optional = true }
executable = { workspace = true, optional = true }
file_system = { workspace = true, optional = true }
little_fs = { workspace = true, optional = true }
log = { workspace = true, optional = true }
network = { workspace = true, optional = true }
task = { workspace = true, optional = true, features = ["test_harness"] }
time = { workspace = true, optional = true }
users = { workspace = true, optional = true }
virtual_file_system = { workspace = true, optional = true }
# `graphics`: headless screen.
graphics = { workspace = true, optional = true }
shared = { workspace = true, optional = true }

[features]
default = []
# Complete in-memory environment. Crates in its dependency tree must use
# xila-testing-support, not xila-testing, in their own tests: linking
# abi_definitions' #[no_mangle] symbols twice fails. ci:host-tests checks this.
environment = [
  "dep:abi_definitions",
  "dep:authentication",
  "dep:drivers_core",
  "dep:executable",
  "dep:file_system",
  "dep:little_fs",
  "dep:log",
  "dep:network",
  "dep:task",
  "dep:time",
  "dep:users",
  "dep:virtual_file_system",
  "drivers_core/wifi_mock",
  "executable/network",
]
# Headless screen (no window) for graphics tests.
graphics = [
  "environment",
  "dep:graphics",
  "dep:shared",
  "graphics/rendering_xrgb8888",
  "executable/graphics",
]

[lib]
name = "testing"
