[package]
name = "xila-testing"
version.workspace = true
edition = "2024"
description = "Minimal std test support for Xila: test devices, allocator and environment setup, without platform drivers"

[dependencies]
# Always: test devices, allocator, logger and executor.
device = { workspace = true }
file_system = { workspace = true }
log = { workspace = true }
memory = { workspace = true }
shared = { workspace = true }
task = { workspace = true, features = ["test_harness"] }
time = { workspace = true }
getrandom = "0.3"
sha2 = "0.11"
# `environment`: initialize() and load_file().
abi_definitions = { workspace = true, optional = true }
authentication = { workspace = true, optional = true }
drivers_core = { workspace = true, optional = true }
executable = { workspace = true, optional = true }
little_fs = { workspace = true, optional = true }
network = { workspace = true, optional = true }
users = { workspace = true, optional = true }
virtual_file_system = { workspace = true, optional = true }
# `graphics`: headless screen.
graphics = { workspace = true, optional = true }

[features]
default = []
# Complete in-memory environment. Crates that `environment` depends on should
# not enable it in their own unit tests (they would be compiled twice).
environment = [
  "dep:abi_definitions",
  "dep:authentication",
  "dep:drivers_core",
  "dep:executable",
  "dep:little_fs",
  "dep:network",
  "dep:users",
  "dep:virtual_file_system",
  "drivers_core/wifi_mock",
]
# Headless screen (no window) for graphics tests.
graphics = [
  "environment",
  "dep:graphics",
  "graphics/rendering_xrgb8888",
  "executable/graphics",
]

[lib]
name = "testing"
