[package]
name = "xila-neural-network"
version.workspace = true
edition = "2024"

[dependencies]
file_system = { workspace = true }
shared = { workspace = true }
synchronization = { workspace = true }
nanoglia = { workspace = true, features = ["alloc"] }

[features]
default = ["kernels", "float", "int16"]
kernels = ["nanoglia/kernels"]
float = ["nanoglia/float"]
int16 = ["nanoglia/int16"]
cmsis-nn = ["nanoglia/cmsis-nn"]
esp-nn = ["nanoglia/esp-nn"]

[lib]
name = "neural_network"

[dev-dependencies]
virtual_file_system = { workspace = true }
task = { workspace = true, features = ["test_harness"] }
users = { workspace = true }
time = { workspace = true }
little_fs = { workspace = true }
drivers_std = { workspace = true }
abi_definitions = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
critical-section = { workspace = true, features = ["std"] }
