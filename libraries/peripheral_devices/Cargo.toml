[package]
name = "xila-peripheral-devices"
version.workspace = true
edition = "2024"

[dependencies]
embedded-io = { workspace = true, optional = true }
embedded-hal = { workspace = true, optional = true }
file_system = { workspace = true }
peripherals = { workspace = true, optional = true }
shared = { workspace = true }
synchronization = { workspace = true }
task = { workspace = true, optional = true }
virtual_file_system = { workspace = true, optional = true }

[dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
virtual_file_system = { workspace = true }
testing = { workspace = true }
embedded-hal = { workspace = true }
peripherals = { workspace = true, features = ["mock"] }
little_fs = { workspace = true }
time = { workspace = true }
users = { workspace = true }
log = { workspace = true }
critical-section = { workspace = true, features = ["std"] }
abi_definitions = { workspace = true }

[features]
default = ["vfs"]
# Mount helper for the virtual file system.
vfs = ["dep:task", "dep:virtual_file_system"]
# UART device node adapter. `mount_uart` is available with the `vfs` feature.
uart = ["dep:peripherals", "dep:embedded-io", "peripherals/uart"]
# I2C device nodes over `peripherals::i2c`.
i2c = ["dep:embedded-hal", "dep:peripherals", "peripherals/i2c"]

[lib]
name = "peripheral_devices"
