[package]
name = "xila-authentication"
version = "0.1.0"
edition = "2024"
description = "User and group authentication module for Xila OS with secure password hashing"
keywords = ["authentication", "security", "users", "groups", "no-std"]
categories = ["authentication", "no-std", "os"]
license = "See main project license"
documentation = "README.md"
readme = "README.md"

[dependencies]
application_metadata = { workspace = true }
# Core Xila modules
virtual_file_system = { workspace = true }
users = { workspace = true }
task = { workspace = true }
file_system = { workspace = true }
device = { workspace = true }

miniserde = { workspace = true }
embedded-i18n = { workspace = true }

[dev-dependencies]
abi_definitions = { workspace = true }
drivers_std = { workspace = true }
drivers_shared = { workspace = true }
drivers_native = { workspace = true }
little_fs = { workspace = true }
time = { workspace = true }
task = { workspace = true, features = ["test_harness"] }

[lib]
name = "authentication"
