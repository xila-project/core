# Templates supply task-local tools only. Native packages remain separate
# ci:packages-* dependencies; formatting templates never bootstrap packages.
[task_templates."ci:rust-format"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "rustfmt",
] }

[task_templates."ci:rust-lint"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }

[task_templates."ci:rust-wasi"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "rustfmt",
], targets = [
  "wasm32-wasip1",
] }

[task_templates."ci:rust-browser"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "rustfmt",
], targets = [
  "wasm32-unknown-unknown",
] }

[task_templates."ci:rust-browser-lint"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "wasm32-unknown-unknown",
] }

[task_templates."ci:rust-wasi-lint"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "wasm32-wasip1",
] }

[task_templates."ci:node"]
tools.node = "{{ vars.node_version }}"

[task_templates."ci:coverage"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "llvm-tools-preview",
  "rustfmt",
] }
tools."aqua:taiki-e/cargo-llvm-cov" = "{{ vars.llvm_cov_version }}"

[task_templates."ci:miri"]
tools.rust = { version = "{{ vars.nightly_version }}", profile = "minimal", components = [
  "miri",
  "rust-src",
] }

[wrappers.cargo]
# Build jobs opt in; quality checks use real Cargo.
command = "env"
args = [
  "{% if env.XILA_MBX | default(value='0') == '1' %}mbx{% else %}cargo{% endif %}",
]
env = { MBX_CARGO_SHIM_MODE = "1" }

[bootstrap.packages]
"apt:clang" = { env = "ci" }
"apt:mold" = { env = "ci" }
"apt:pkg-config" = { env = "host" }
"apt:libudev-dev" = { env = "host" }
"apt:libxkbcommon-dev" = { env = "host" }
"apt:libwayland-dev" = { env = "host" }
"apt:libx11-dev" = { env = "host" }
"apt:libxkbcommon-x11-dev" = { env = "host" }
"apt:time" = { env = "benchmark" }
"apt:lld" = { env = "sdk" }
"apt:llvm" = { env = "sdk" }
"apt:cmake" = { env = "sdk" }
"apt:zstd" = { env = "sdk" }
"apt:gcc-arm-none-eabi" = { env = "sdk-arm" }
"apt:gcc-riscv64-unknown-elf" = { env = "sdk-riscv" }

[tasks."ci:packages-linker"]
description = "Install continuous integration linker packages only when missing"
run = "python3 tools/ci/install_packages.py ci"

[tasks."ci:toolchain"]
description = "Prepare the pinned stable compiler and report its cache key"
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal" }
run = """
set -eu
rustc --version
if [ -n "${GITHUB_OUTPUT:-}" ]; then
  echo "version={{ vars.rust_version }}" >> "$GITHUB_OUTPUT"
fi
"""

[tasks."ci:toolchain-xtensa"]
description = "Install the pinned ESP32-S3 Rust, GCC and libclang toolchain"
tools."github:esp-rs/espup" = "{{ vars.espup_version }}"
run = """
set -eu
export_file=target/espup/export-esp.sh
mkdir -p target/espup
espup install --targets esp32s3 --toolchain-version "{{ vars.rust_version }}.0" --skip-version-parse --crosstool-toolchain-version "{{ vars.esp_gcc_version }}" --export-file "$export_file"
if [ -n "${GITHUB_PATH:-}" ] && [ -n "${GITHUB_ENV:-}" ]; then
  . "$export_file"
  gcc=$(command -v xtensa-esp32s3-elf-gcc)
  printf '%s\\n' "${gcc%/*}" >> "$GITHUB_PATH"
  printf 'LIBCLANG_PATH=%s\\n' "$LIBCLANG_PATH" >> "$GITHUB_ENV"
fi
"""

[tasks."ci:toolchain-nightly"]
description = "Prepare the pinned nightly compiler and report its cache key"
tools.rust = { version = "{{ vars.nightly_version }}", profile = "minimal" }
run = """
set -eu
rustc --version
if [ -n "${GITHUB_OUTPUT:-}" ]; then
  echo "version={{ vars.nightly_version }}" >> "$GITHUB_OUTPUT"
fi
"""

[tasks."ci:packages-host"]
description = "Install continuous integration native graphical and linker packages"
run = "python3 tools/ci/install_packages.py ci,host"

[tasks."ci:packages-host-sdk"]
description = "Install continuous integration native graphical, linker, and software development kit packages in one transaction"
run = "python3 tools/ci/install_packages.py ci,host,sdk"

[tasks."ci:packages-sdk"]
description = "Install the native software development kit build packages (LLVM linker and tools, CMake, zstd)"
run = "python3 tools/ci/install_packages.py ci,sdk"

[tasks."ci:packages-sdk-arm"]
description = "Install the native software development kit build packages and the Arm GNU toolchain (libgcc for Cortex-M). On GitHub Actions runners only, writes /etc/apt/apt.conf.d/90xila-no-install-recommends before installing the Arm toolchain, so that apt skips the recommended newlib packages (about a 607 MB download with them, about 70.6 MB and 568 MB on disk without); anywhere else it installs gcc-arm-none-eabi with its recommends and changes no apt configuration"
depends = ["ci:packages-sdk"]
run = """
set -eu
# mise runs a plain `apt-get install -y` and cannot skip recommended packages: gcc-arm-none-eabi
# recommends libnewlib-arm-none-eabi, which recommends libstdc++-arm-none-eabi-newlib. The SDK
# needs neither (it links picolibc and only takes libgcc.a). The only way to skip them through
# mise is a system-wide apt setting, which persists after the install, so it is written on a
# throwaway runner only and never on a developer machine. It is written after the
# ci:packages-sdk dependency, so that it applies to the Arm toolchain only.
if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
  mise -E apt-no-recommends bootstrap files apply --yes
else
  echo "Not on a GitHub Actions runner: leaving the apt configuration untouched, so apt installs the recommended newlib packages."
fi
python3 tools/ci/install_packages.py ci,sdk-arm
"""

[tasks."ci:packages-sdk-riscv"]
description = "Install the native software development kit build packages and the RISC-V ILP32 compiler runtime"
run = "python3 tools/ci/install_packages.py ci,sdk,sdk-riscv"

[tasks."ci:packages-benchmark"]
description = "Install benchmark packages before timed commands"
run = "python3 tools/ci/install_packages.py ci,host,benchmark"

[tasks."ci:format-rust"]
