] }
tools."github:nextest-rs/nextest" = "cargo-nextest-{{ vars.nextest_version }}"

[tasks."ci:bare-metal"]
description = "Check the Cortex-M and hard-float RISC-V façades, bare-metal graphics and the 32-bit native ABI, with and without network"
shell = "bash -c"
depends = ["ci:packages-host"]
# No C library on bare metal: build LittleFS with clang's freestanding headers.
# bindgen (lvgl-rust-sys) adds the resource include directory of every clang it
# finds, and the runner image ships LLVM 20, 21 and 22. In hosted mode each copy
# of clang's <stdint.h> defers to the next one through #include_next while sharing
# one include guard, so the second copy is empty and no integer type is defined.
# -ffreestanding makes the first copy define them itself, whatever libclang loads.
env = { CC_thumbv7em_none_eabihf = "clang", CC_riscv32imac_unknown_none_elf = "clang", CC_riscv32imafc_unknown_none_elf = "clang", BINDGEN_EXTRA_CLANG_ARGS_thumbv7em_none_eabihf = "-ffreestanding", BINDGEN_EXTRA_CLANG_ARGS_riscv32imac_unknown_none_elf = "-ffreestanding", BINDGEN_EXTRA_CLANG_ARGS_riscv32imafc_unknown_none_elf = "-ffreestanding" }
run = """
set -eu
for target in thumbv7em-none-eabihf riscv32imafc-unknown-none-elf; do
  cargo check --locked -p xila --target "$target"
  cargo check --locked -p xila --no-default-features --target "$target"
  cargo check --locked -p xila --features task_metrics --target "$target"
  cargo check --locked -p xila-time-zone --features iana-all --target "$target"
done
# Graphics is C-backed and its FFI differs by target: `c_char` is unsigned on ARM and RISC-V.
cargo check --locked -p xila-graphics --features rendering_rgb565 --target thumbv7em-none-eabihf
cargo check --locked -p xila-graphics --features rendering_rgb565 --target riscv32imac-unknown-none-elf
# lvgl-rust-sys derives -march/-mabi from the target and exports them to the font build.
cargo check --locked -p xila-graphics --features rendering_rgb565 --target riscv32imafc-unknown-none-elf
# Verify that the C static archives built by this run for riscv32imafc use the
# single-float ABI (EF_RISCV_FLOAT_ABI_SINGLE). Take the build script output
# directories from Cargo's messages (the checks above are fresh, so this is fast),
# not from a glob that would also match archives restored from the target cache.
out_directories=$(
  {
    cargo check --locked -p xila --target riscv32imafc-unknown-none-elf --message-format=json
    cargo check --locked -p xila-graphics --features rendering_rgb565 --target riscv32imafc-unknown-none-elf --message-format=json
  } | grep '"reason":"build-script-executed"' | grep -o '"out_dir":"[^"]*"' | cut -d '"' -f 4 | sort -u
)
for expected in liblfs-sys.a liblvgl.a libfont_assets.a; do
  found=0
  for directory in $out_directories; do
    archive="$directory/$expected"
    [ -f "$archive" ] || continue
    found=1
    flags_output=$(LC_ALL=C readelf -h "$archive" | grep 'Flags:' || true)
    if [ -z "$flags_output" ] || printf '%s\\n' "$flags_output" | grep -qv 'single-float ABI'; then
      echo "error: $archive contains objects without EF_RISCV_FLOAT_ABI_SINGLE" >&2
      printf '%s\\n' "$flags_output" >&2
      exit 1
    fi
  done
  if [ "$found" -eq 0 ]; then
    echo "error: this run built no $expected for riscv32imafc-unknown-none-elf" >&2
    exit 1
  fi
done
for target in thumbv7em-none-eabihf riscv32imac-unknown-none-elf riscv32imafc-unknown-none-elf; do
  cargo clippy --locked -p xila-abi-application --no-default-features --target "$target" -- -D warnings
  cargo clippy --locked -p xila-abi-application --features network --target "$target" -- -D warnings
done
# `check` never assembles inline assembly. Build the floating-point control code (`vmrs`, `frcsr`)
# and corosensei's switch, which `xila-stackful` instantiates itself, for every float target.
for target in thumbv7em-none-eabihf thumbv8m.main-none-eabihf riscv32imafc-unknown-none-elf; do
  cargo build --locked -p xila-stackful --target "$target" --release
done
"""
# rustfmt keeps generated binding diagnostics readable; bindgen continues without it.
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "thumbv7em-none-eabihf",
  "thumbv8m.main-none-eabihf",
  "riscv32imac-unknown-none-elf",
  "riscv32imafc-unknown-none-elf",
] }
# The graphics build script generates fonts with the pinned Node converter.
tools.node = "{{ vars.node_version }}"

[tasks."ci:xtensa"]
description = "Build LittleFS and RGB565 graphics for bare-metal ESP32-S3, and the stackful switch and its consumers (VFS, application ABI, native loader) for ESP32, ESP32-S2 and ESP32-S3"
extends = "ci:node"
# Locally, run ci:toolchain-xtensa and source target/espup/export-esp.sh to put
# Xtensa GCC on PATH and point LIBCLANG_PATH at Espressif's libclang.
# As in ci:bare-metal, -ffreestanding makes Clang's <stdint.h> define the
# integer types for LVGL bindgen instead of deferring to later include paths.
env = { CC_xtensa_esp32s3_none_elf = "xtensa-esp32s3-elf-gcc", BINDGEN_EXTRA_CLANG_ARGS_xtensa_esp32s3_none_elf = "-ffreestanding" }
# Run Cargo directly with the esp toolchain, which supplies Xtensa Rust and rust-src.
# The stackful switch (corosensei's Xtensa backend) and its consumers need no C
# toolchain, so the other chips only build those crates. The ESP32-S2 has no atomic
# CAS: like esp-hal for these chips, select portable-atomic's single-core backend.
run = """
set -eu
rustup run esp cargo build --locked -Zbuild-std=core,alloc --target xtensa-esp32s3-none-elf -p xila-little-fs -p xila-graphics -p xila-stackful -p xila-virtual-file-system -p xila-native-loader -p xila-abi-application -p xila-executable --features xila-graphics/rendering_rgb565,xila-abi-application/network,xila-abi-application/graphics,xila-executable/native-dev,xila-executable/graphics
rustup run esp cargo build --locked -Zbuild-std=core,alloc --target xtensa-esp32-none-elf -p xila-stackful -p xila-virtual-file-system -p xila-native-loader -p xila-abi-application
RUSTFLAGS="--cfg portable_atomic_unsafe_assume_single_core" rustup run esp cargo build --locked -Zbuild-std=core,alloc --target xtensa-esp32s2-none-elf -p xila-stackful -p xila-virtual-file-system -p xila-native-loader -p xila-abi-application
"""

[tasks."ci:bare-metal-no-cas"]
description = "Check the façade and peripheral adapters for a RISC-V target without atomic compare-and-swap"
shell = "bash -c"
depends = ["ci:packages-linker"]
# ESP32-C2/C3 have atomic load/store only. Libraries never choose a
# portable-atomic backend; the firmware does (esp-hal enables
# `unsafe-assume-single-core` for these chips). Select the same backend here.
env = { CC_riscv32imc_unknown_none_elf = "clang", CARGO_TARGET_RISCV32IMC_UNKNOWN_NONE_ELF_RUSTFLAGS = "--cfg portable_atomic_unsafe_assume_single_core" }
run = """
set -eu
cargo check --locked -p xila --target riscv32imc-unknown-none-elf
cargo check --locked -p xila --no-default-features --target riscv32imc-unknown-none-elf
cargo check --locked -p xila --features task_metrics --target riscv32imc-unknown-none-elf
cargo check --locked -p xila-drivers-peripherals --all-features --target riscv32imc-unknown-none-elf
cargo check --locked -p xila-peripherals --all-features --target riscv32imc-unknown-none-elf
cargo check --locked -p xila-audio --target riscv32imc-unknown-none-elf
"""
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", targets = [
  "riscv32imc-unknown-none-elf",
] }

[tasks."ci:profiling-task-tests"]
extends = "ci:rust-lint"
description = "Lint and test the task subsystem's profiling and metrics features"
shell = "bash -c"
depends = ["ci:packages-host"]
tools."github:nextest-rs/nextest" = "cargo-nextest-{{ vars.nextest_version }}"
run = """
set -eu
cargo clippy --locked -p xila-task --lib --tests --features test_harness,metrics,profiling -- -D warnings
cargo nextest run --locked -p xila-task --lib --features test_harness,profiling
cargo nextest run --locked -p xila-task --lib --features test_harness,metrics,profiling
"""

[tasks."test:native-loader"]
extends = "ci:rust-lint"

[tasks."ci:sdk-build"]
description = "Build the native SDK archive for XILA_SDK_TARGET"
run = "mise run sdk:build"

[tasks."ci:sdk-verify"]
description = "Check the SDK examples' (hello, probe, threads, ssp) ELF contract and report the hello size for XILA_SDK_TARGET"
run = "mise run sdk:verify"

[tasks."ci:sdk-test"]
description = "Test the SDK's ELF checker"
run = "mise run sdk:test"

[tasks."ci:native-loader-targets"]
description = "Check native ABI layouts and build the bare-metal ELF loader"
depends = ["ci:packages-host"]
run = """
set -eu
for target in thumbv7em-none-eabihf riscv32imac-unknown-none-elf riscv32imafc-unknown-none-elf; do
  cargo check --locked -p xila-executable --features native-dev --target "$target"
  cargo build --locked --release -p xila-executable --features native-dev --target "$target"
done
cargo check --locked -p xila-abi-application --target aarch64-unknown-linux-gnu
# Stable lints the bindings and, on Linux, the runtime. `link` needs the nightly,
# and `runtime` alone on bare metal warns that a guest needs `link`.
xila_sys=libraries/abi/application/sdk/rust/xila-sys/Cargo.toml
for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
  cargo clippy --locked --manifest-path "$xila_sys" --features runtime \
    --target-dir target/sdk/rust-bindings --target "$target" -- -D warnings
done
for target in thumbv7em-none-eabihf riscv32imac-unknown-none-elf riscv32imafc-unknown-none-elf; do
  cargo clippy --locked --manifest-path "$xila_sys" \
    --target-dir target/sdk/rust-bindings --target "$target" -- -D warnings
done
# The guest nightly lints `link`, including the generated link.rs.
mise run ci:native-loader-link-lint
"""
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "clippy",
], targets = [
  "aarch64-unknown-linux-gnu",
  "thumbv7em-none-eabihf",
  "riscv32imac-unknown-none-elf",
  "riscv32imafc-unknown-none-elf",
] }

[tasks."ci:native-loader-link-lint"]
description = "Lint xila-sys with its link feature on the guest nightly"
run = """
set -eu
xila_sys=libraries/abi/application/sdk/rust/xila-sys/Cargo.toml
for target in x86_64-unknown-linux-gnu thumbv7em-none-eabihf riscv32imac-unknown-none-elf riscv32imafc-unknown-none-elf; do
  cargo clippy --locked --manifest-path "$xila_sys" \
    --features link --target-dir target/sdk/rust-bindings-nightly --target "$target" -- -D warnings
done
"""
tools.rust = { version = "{{ vars.nightly_version }}", profile = "minimal", components = [
  "clippy",
], targets = [
  "thumbv7em-none-eabihf",
  "riscv32imac-unknown-none-elf",
  "riscv32imafc-unknown-none-elf",
] }
