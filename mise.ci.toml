run = """
set -euo pipefail
memory="${CI_ABI_MEMORY:-memory_32}"
case "$memory" in
  memory_32)
    cargo miri test --locked --manifest-path \"${XILA_APPLICATIONS_ROOT:-.application-src}/executables/wasm/tests/translation/Cargo.toml\" --no-default-features --features memory_32 --target powerpc-unknown-linux-gnu
    cargo miri test --locked --manifest-path subsystems/graphics/tests/call_transport/Cargo.toml --target powerpc-unknown-linux-gnu
    ;;
  memory_64)
    cargo miri test --locked --manifest-path \"${XILA_APPLICATIONS_ROOT:-.application-src}/executables/wasm/tests/translation/Cargo.toml\" --no-default-features --features memory_64 --target i686-unknown-linux-gnu
    cargo miri test --locked --manifest-path subsystems/graphics/tests/call_transport/Cargo.toml --target i686-unknown-linux-gnu
    ;;
  *)
    echo "Unsupported ABI memory mode: $memory" >&2
    exit 2
    ;;
esac
"""

